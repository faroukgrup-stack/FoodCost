<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الطعام</title>
  <meta name="theme-color" content="#1a120c" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #120e0b;
      --card: #1c1612;
      --line: rgba(212,175,120,0.22);
      --gold: #e6c27a;
      --gold-2: #b48554;
      --text: #f6f1ea;
      --muted: #b7aa9c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(18,14,11,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px 10px;
    }
    header h1 { font-size: 1.25rem; color: var(--gold); letter-spacing: 0.2px; }
    header p { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .banner-wrap { padding: 12px 0 4px; overflow: hidden; }
    .banner-track {
      display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 0 16px 8px; scrollbar-width: none;
    }
    .banner-track::-webkit-scrollbar { display: none; }
    .banner-track img {
      scroll-snap-align: center;
      width: min(88vw, 420px); height: 150px; object-fit: cover; flex: 0 0 auto;
      border-radius: 16px; border: 1px solid var(--line);
    }
    .cats {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px;
      position: sticky; top: 58px; z-index: 15;
      background: rgba(18,14,11,0.94); scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 7px 14px; font-family: inherit; font-weight: 600; cursor: pointer;
    }
    .cat.on { background: var(--gold); color: #1a120c; border-color: var(--gold); }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 12px 16px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; min-width: 0;
    }
    .card-img {
      height: 112px; background: #2a221c center/cover no-repeat; position: relative;
    }
    .card-img .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.4rem; }
    .card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-name { font-size: 0.92rem; font-weight: 700; line-height: 1.35; cursor: pointer; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .price { color: var(--gold); font-weight: 700; font-size: 0.82rem; }
    .plus {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--gold); color: #1a120c;
      font-size: 1.25rem; font-weight: 700; cursor: pointer; line-height: 1;
    }
    .sheet {
      position: fixed; inset: 0; background: rgba(0,0,0,0.62); z-index: 40;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet.open { display: flex; }
    .sheet-box {
      width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
      background: #1a1410; border-radius: 22px 22px 0 0; border: 1px solid var(--line);
    }
    .sheet-img { width: 100%; height: 210px; object-fit: cover; background: #2a221c; display: block; }
    .sheet-pad { padding: 14px 16px 18px; }
    .sheet-pad h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
    .label { font-size: 0.8rem; color: var(--gold); margin: 10px 0 8px; font-weight: 700; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 12px; padding: 8px 12px; font-family: inherit; cursor: pointer;
    }
    .choice.on { border-color: var(--gold); background: rgba(230,194,122,0.15); color: var(--gold); }
    .extra {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .extra button {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
      background: transparent; color: var(--gold); font-family: inherit; cursor: pointer;
    }
    .sheet-actions {
      display: flex; gap: 10px; align-items: center; margin-top: 16px;
    }
    .qtybox { display: flex; align-items: center; gap: 8px; }
    .qtybox button {
      width: 34px; height: 34px; border-radius: 50%; border: none; background: #2a221c; color: var(--text);
      font-size: 1.1rem; cursor: pointer;
    }
    .addwide {
      flex: 1; background: var(--gold); color: #1a120c; border: none; border-radius: 14px;
      padding: 12px; font-weight: 800; font-family: inherit; cursor: pointer;
    }
    .x {
      position: absolute; top: 10px; left: 10px; width: 34px; height: 34px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.55); color: #fff; font-size: 1.3rem; cursor: pointer;
    }
    .hero-img { position: relative; }
    .cartbar {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30;
      background: var(--gold); color: #1a120c; border-radius: 16px;
      display: none; align-items: center; justify-content: space-between;
      padding: 12px 14px; font-weight: 800;
    }
    .cartbar.show { display: flex; }
    .cartbar button { border: none; background: transparent; font-weight: 800; font-family: inherit; cursor: pointer; color: inherit; }
    .cart-line { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
    .empty, .loading { text-align: center; color: var(--muted); padding: 30px 16px; }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(3, 1fr); max-width: 860px; margin: 0 auto; }
      header, .cats, .banner-track { max-width: 860px; margin-left: auto; margin-right: auto; }
    }
  </style>

<style>
:root{--bg:#10151e;--card:#192230;--line:#ffffff16;--gold:#edc98a;--text:#f8f6f1;--muted:#aab5c5}
body{background:radial-gradient(ellipse at top,#202a3b 0,#10151e 55%);padding-bottom:110px}

header h1{font-size:clamp(1.5rem,4vw,2.2rem);color:#fff}header p{font-size:.95rem;margin-top:8px}

.menu-tools{max-width:1120px;margin:auto;padding:8px 16px 16px}.menu-tools label{display:block;margin-bottom:8px;color:var(--muted);font-size:.85rem}.menu-tools input{width:100%;padding:15px 18px;border-radius:15px;border:1px solid var(--line);background:#192230;color:#fff;font:inherit}
.cats{max-width:1120px;top:0;background:#10151ef5;backdrop-filter:blur(18px);padding:14px 16px;border-bottom:1px solid var(--line);margin:auto}
.cat{padding:10px 18px;min-height:44px}.grid{display:block!important;max-width:1120px!important;margin:auto;padding:8px 16px 24px}
.menu-section{margin:14px 0 30px}.section-title{font-size:1.2rem;margin:0 0 16px}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border-radius:20px;box-shadow:0 8px 24px #0002}.card-img{width:100%;height:auto;aspect-ratio:1;display:block;padding:0;border:0;background:#243044;cursor:pointer;overflow:hidden}

.card-foot{gap:6px}.price{font-size:.85rem}.plus{min-width:40px;width:40px;height:40px}.sheet-box{max-width:600px;background:#192230;border-radius:26px 26px 0 0;overscroll-behavior:contain}.sheet-img{height:auto;aspect-ratio:1;object-fit:cover}
.sheet-pad{padding:22px}.sheet-actions{position:sticky;bottom:0;background:#192230;padding:12px 0;margin-top:20px}.addwide{min-height:48px;font-size:.95rem}.addwide:disabled{opacity:.45}

.cart-heading,.order-total{display:flex;justify-content:space-between;align-items:center;gap:12px}.order-total{padding:18px 0;font-size:1.1rem}.cart-line{padding:18px 0}.cart-line p,.cart-line small{color:var(--muted)}
.cart-step{display:flex;align-items:center;gap:12px;margin-top:12px}.cart-step button{border:1px solid var(--line);background:#243044;color:var(--text);border-radius:10px;min-width:40px;min-height:40px;font:inherit;padding:4px 10px}
#custName,#custNote{display:block;width:100%;padding:14px;background:#10151e;color:#fff;border:1px solid var(--line);border-radius:12px;font:inherit;margin:8px 0 16px}.checkout-note{font-size:.82rem;color:var(--muted);margin:14px 0}
#menuStatus{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;font-size:13px;background:#edc98a;color:#152033;border-radius:12px;padding:0;max-width:90vw}#menuStatus:not(:empty){padding:10px 16px}
[data-image-error]{position:relative}[data-image-error]::after{content:attr(data-image-error);position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}

<body>
  <header>
    <h1 id="restName">قائمة الطعام</h1>
    <p id="restSub"></p>
  </header>
  <div id="bannerWrap" class="banner-wrap" style="display:none;"><div id="bannerTrack" class="banner-track"></div></div>
  <div class="menu-tools"><label for="menuSearch">ابحث عن وجبتك</label><input id="menuSearch" type="search" placeholder="اسم الوجبة أو وصفها…" oninput="renderGrid()"></div><nav id="cats" class="cats" aria-label="أقسام القائمة"></nav><div id="menuStatus" role="status" aria-live="polite"></div>
  <div id="grid" class="grid"><div class="loading">جاري التحميل...</div></div>

  <div id="cartBar" class="cartbar">
    <span id="cartSummary">0</span>
    <button type="button" onclick="openCart()">عرض الطلب</button>
  </div>

  <div id="itemSheet" class="sheet" onclick="if(event.target===this)closeSheet()">
    <div class="sheet-box" id="itemSheetBox"></div>
  </div>
  <div id="cartSheet" class="sheet" onclick="if(event.target===this)closeCart()">
    <div class="sheet-box" id="cartSheetBox"></div>
  </div>

<script src="js/config.js?v=2.2"></script>
<script>

function menuImageUrl(value) {
  try {
    const u = new URL(String(value || '').trim());
    if (!['https:','http:'].includes(u.protocol)) return '';
    if (['drive.google.com','lh3.googleusercontent.com'].includes(u.hostname)) {
      const id = u.searchParams.get('id') || (u.pathname.match(/\/d\/([\w-]+)/)||[])[1] || (u.pathname.match(/\/file\/d\/([\w-]+)/)||[])[1];
      if (id) {
        return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(id);
      }
    }
    return u.href;
  } catch(e) { return ''; }
}
function menuImageFallback(img) {
  if (!img.dataset.retry) {
    img.dataset.retry = '1';
    try {
      const u = new URL(img.src);
      let id = u.searchParams.get('id');
      if (!id && u.hostname === 'drive.google.com') {
        id = (u.pathname.match(/\/d\/([\w-]+)/)||[])[1] || (u.pathname.match(/\/file\/d\/([\w-]+)/)||[])[1];
      }
      if (id) {
        img.src = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w1600';
        return;
      }
    } catch (e) {}
  } else if (img.dataset.retry === '1') {
    img.dataset.retry = '2';
    try {
      const u = new URL(img.src);
      let id = u.searchParams.get('id') || (u.pathname.match(/\/d\/([\w-]+)/)||[])[1];
      if (id) {
        img.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1600';
        return;
      }
    } catch (e) {}
  }
  img.onerror = null;
  img.style.visibility = 'hidden';
  if (img.parentElement) img.parentElement.dataset.imageError = 'الصورة غير متاحة';
}

const params = new URLSearchParams(location.search);
const restaurantEmail = (params.get('restaurant') || '').trim().toLowerCase();
let menuData = null;
let cart = [];
let currentCategory = 'الكل';
let draft = null;

if (!restaurantEmail) {
  document.getElementById('grid').innerHTML = '<div class="empty">رابط غير صالح. افتح المينيو من رمز QR بعد تسجيل الدخول.</div>';
} else {
  loadMenu();
}

async function loadMenu() {
  try {
    const url = new URL(COST_API_URL);
    url.searchParams.set('fn', 'getPublicMenu');
    url.searchParams.set('restaurantEmail', restaurantEmail);
    url.searchParams.set('_v', Date.now());
    const res = await fetch(url.toString(), { cache:'no-store', headers: { Accept: 'application/json' } });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'فشل التحميل');
    menuData = data;
    document.getElementById('restName').textContent = data.settings.name || 'المطعم';
    document.title = data.settings.name || 'قائمة الطعام';
    document.getElementById('restSub').textContent = data.settings.subtitle || '';
    renderBanners(data.settings.banners || []);
    renderCats();
    renderGrid();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">تعذر تحميل القائمة: ' + esc(e.message) + '</div>';
  }
}

function renderBanners(list) {
  const wrap = document.getElementById('bannerWrap');
  const track = document.getElementById('bannerTrack');
  if (!list.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  track.innerHTML = list.slice(0, 3).map(u => `<img src="${esc(menuImageUrl(u))}" alt="صورة عرض المطعم" onerror="menuImageFallback(this)">`).join('');
  if (list.length > 1) startBanner(track);
}

function startBanner(track) {
  let i = 0;
  clearInterval(window.menuBannerTimer);
  window.menuBannerTimer = setInterval(() => {
    if(document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const kids = track.children;
    if (kids.length < 2) return;
    i = (i + 1) % kids.length;
    kids[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 3500);
}

function renderCats() {
  const cats = menuData.categories && menuData.categories.length ? menuData.categories : ['الكل'];
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="cat ${c === currentCategory ? 'on' : ''}" onclick="setCat('${js(c)}')">${esc(c)}</button>`
  ).join('');
}
function setCat(c) { currentCategory = c; renderCats(); renderGrid(); }

function itemsNow() {
  let items = menuData.items || [];
  if (currentCategory !== 'الكل') items = items.filter(it => it.category === currentCategory);
  return items;
}
function fromPrice(it) {
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{ name: 'عادي', price: 0 }];
  return Math.min.apply(null, sizes.map(s => Number(s.price) || 0));
}
function cur() { return (menuData.settings && menuData.settings.currency) || ''; }


function renderGrid() {
  const term=(document.getElementById('menuSearch')?.value||'').trim().toLocaleLowerCase('ar');
  const items=itemsNow().filter(it=>(it.name+' '+(it.description||'')).toLocaleLowerCase('ar').includes(term));
  const grid=document.getElementById('grid');grid.replaceChildren();
  if(!items.length){grid.innerHTML='<div class="empty">لا توجد وجبات مطابقة</div>';return;}
  const cats=[...new Set([...(menuData.categories||[]).filter(c=>c!=='الكل'),...items.map(it=>it.category||'أخرى')])];
  cats.forEach(cat=>{
    const group=items.filter(it=>(it.category||'أخرى')===cat).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
    if(!group.length)return;
    const section=document.createElement('section');section.className='menu-section';
    const title=document.createElement('h2');title.className='section-title';title.textContent=cat+' · '+group.length;section.append(title);
    const cards=document.createElement('div');cards.className='section-grid';
    group.forEach(it=>{
      const card=document.createElement('article');card.className='card';
      const photo=document.createElement('button');photo.type='button';photo.className='card-img';photo.setAttribute('aria-label','عرض '+it.name);photo.onclick=()=>openItem(it.id);
      if(it.imageUrl){const image=document.createElement('img');image.src=menuImageUrl(it.imageUrl);image.alt=it.name;image.loading='lazy';image.decoding='async';image.onerror=()=>menuImageFallback(image);photo.append(image);}
      else{photo.textContent='صورة الوجبة';photo.classList.add('no-photo');}
      const body=document.createElement('div');body.className='card-body';
      const name=document.createElement('button');name.type='button';name.className='card-name';name.textContent=it.name;name.onclick=()=>openItem(it.id);body.append(name);
      if(it.description){const desc=document.createElement('p');desc.className='card-desc';desc.textContent=it.description;body.append(desc);}
      const foot=document.createElement('div');foot.className='card-foot';
      const price=document.createElement('span');price.className='price';price.textContent=((it.sizes||[]).length>1?'ابتداءً من ':'')+Number(fromPrice(it)).toFixed(2)+' '+cur();
      const add=document.createElement('button');add.type='button';add.className='plus';add.textContent='+';add.setAttribute('aria-label','إضافة '+it.name);add.onclick=()=>quickAdd(it.id);
      foot.append(price,add);body.append(foot);card.append(photo,body);cards.append(card);
    });
    section.append(cards);grid.append(section);
  });
}

function findItem(id) { return (menuData.items || []).find(x => x.id === id); }

function quickAdd(id) {
  const it = findItem(id);
  if (!it) return;
  if ((it.sizes||[]).length>1 || (it.extras||[]).length) {openItem(id);return;}
  const size = (it.sizes && it.sizes[0]) || { name: 'عادي', price: 0 };
  addLine(it, size, [], 1);
}

function openItem(id) {
  const it = findItem(id);
  if (!it) return;
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{ name: 'عادي', price: 0 }];
  const prev = (draft && draft.id === id) ? draft : null;
  draft = prev || { id, size: sizes[0].name, qty: 1, extras: {} };
  if (!sizes.some(s => s.name === draft.size)) draft.size = sizes[0].name;
  const img = it.imageUrl
    ? `<div class="hero-img"><img onerror="menuImageFallback(this)" class="sheet-img" src="${esc(menuImageUrl(it.imageUrl))}" alt=""><button class="x" onclick="closeSheet()">×</button></div>`
    : `<div class="hero-img" style="height:48px"><button class="x" onclick="closeSheet()">×</button></div>`;
  document.getElementById('itemSheetBox').innerHTML = `
    ${img}
    <div class="sheet-pad">
      <h2>${esc(it.name)}</h2>
      ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
      <div class="label">المقاس</div>
      <div class="choices" id="sizeChoices">
        ${sizes.map(s => `<button class="choice ${s.name === draft.size ? 'on' : ''}" onclick="pickSize('${js(s.name)}')">${esc(s.name)} · ${s.price} ${esc(cur())}</button>`).join('')}
      </div>
      ${(it.extras && it.extras.length) ? `<div class="label">إضافات</div><div id="extraList">${it.extras.map((ex, i) => `
        <div class="extra"><span>${esc(ex.name)} · ${ex.price} ${esc(cur())}</span>
        <span><button onclick="chgExtra(${i},-1)">−</button> <b id="ex${i}">${draft.extras[i] || 0}</b> <button onclick="chgExtra(${i},1)">+</button></span></div>`).join('')}</div>` : ''}
      <div class="sheet-actions">
        <div class="qtybox">
          <button onclick="chgDraft(-1)">−</button>
          <b id="draftQty">${draft.qty}</b>
          <button onclick="chgDraft(1)">+</button>
        </div>
        <button class="addwide" onclick="confirmDraft()">أضف للطلب · <span id="draftTotal"></span></button>
      </div>
    </div>`;
  document.getElementById('itemSheet').classList.add('open');
  paintDraftTotal();
}
function closeSheet() { document.getElementById('itemSheet').classList.remove('open'); draft = null; }
function pickSize(name) { draft.size = name; openItem(draft.id); }
function chgDraft(d) { draft.qty = Math.max(1, draft.qty + d); document.getElementById('draftQty').textContent = draft.qty; paintDraftTotal(); }
function chgExtra(i, d) {
  draft.extras[i] = Math.max(0, (draft.extras[i] || 0) + d);
  document.getElementById('ex' + i).textContent = draft.extras[i];
  paintDraftTotal();
}
function paintDraftTotal() {
  const it = findItem(draft.id);
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{ name: 'عادي', price: 0 }];
  const size = sizes.find(s => s.name === draft.size) || sizes[0];
  let extra = 0;
  (it.extras || []).forEach((ex, i) => { extra += (draft.extras[i] || 0) * (Number(ex.price) || 0); });
  const total = (Number(size.price) + extra) * draft.qty;
  const el = document.getElementById('draftTotal');
  if (el) el.textContent = total + ' ' + cur();
}
function confirmDraft() {
  const it = findItem(draft.id);
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{ name: 'عادي', price: 0 }];
  const size = sizes.find(s => s.name === draft.size) || sizes[0];
  const extras = [];
  (it.extras || []).forEach((ex, i) => {
    const q = draft.extras[i] || 0;
    if (q > 0) extras.push({ name: ex.name, price: ex.price, qty: q });
  });
  addLine(it, size, extras, draft.qty);
  closeSheet();
}
function lineKey(name, size, extras) {
  return name + '|' + size + '|' + extras.map(e => e.name + 'x' + e.qty).join(',');
}
function addLine(it, size, extras, qty) {
  const key = lineKey(it.name, size.name, extras);
  const found = cart.find(c => c.key === key);
  if (found) found.qty += qty;
  else cart.push({ key, name: it.name, size: size.name, price: Number(size.price) || 0, extras, qty });
  paintCart();
  document.getElementById('menuStatus').textContent='تمت إضافة '+it.name+' إلى الطلب';
  clearTimeout(window.menuToastTimer);window.menuToastTimer=setTimeout(()=>document.getElementById('menuStatus').textContent='',2500);
}
function lineTotal(c) {
  const extra = (c.extras || []).reduce((s, e) => s + e.price * e.qty, 0);
  return (c.price + extra) * c.qty;
}
function paintCart() {
  const n = cart.reduce((s, c) => s + c.qty, 0);
  const total = cart.reduce((s, c) => s + lineTotal(c), 0);
  const bar = document.getElementById('cartBar');
  bar.classList.toggle('show', n > 0);
  document.getElementById('cartSummary').textContent = n + ' · ' + total + ' ' + cur();
}

function openCart() {
  const prevName=document.getElementById('custName')?.value||sessionStorage.getItem('menuCustomerName')||'';
  const prevNote=document.getElementById('custNote')?.value||sessionStorage.getItem('menuCustomerNote')||'';
  const lines=cart.map((c,i)=>`<div class="cart-line"><div><b>${esc(c.name)}</b><p>${esc(c.size||'')}</p><small>${(c.extras||[]).map(e=>esc(e.name)+' ×'+e.qty).join('، ')}</small><div class="cart-step"><button onclick="changeCartQty(${i},-1)" aria-label="تقليل الكمية">−</button><span>${c.qty}</span><button onclick="changeCartQty(${i},1)" aria-label="زيادة الكمية">+</button><button onclick="removeCartLine(${i})">حذف</button></div></div><strong>${lineTotal(c).toFixed(2)} ${esc(cur())}</strong></div>`).join('');
  const total=cart.reduce((s,c)=>s+lineTotal(c),0);
  document.getElementById('cartSheetBox').innerHTML=`<div class="sheet-pad"><div class="cart-heading"><h2>مراجعة طلبك</h2><button class="x" style="position:static" onclick="closeCart()" aria-label="إغلاق">×</button></div>${lines||'<div class="empty">طلبك فارغ — أضف وجبتك المفضلة</div>'}<div class="order-total"><span>الإجمالي</span><strong>${total.toFixed(2)} ${esc(cur())}</strong></div><label for="custName">الاسم (اختياري)</label><input id="custName" value="${esc(prevName)}" placeholder="اسمك" oninput="sessionStorage.setItem('menuCustomerName',this.value)"><label for="custNote">ملاحظات الطلب</label><textarea id="custNote" rows="3" placeholder="أي تفاصيل تود إضافتها؟" oninput="sessionStorage.setItem('menuCustomerNote',this.value)">${esc(prevNote)}</textarea><p class="checkout-note">سيتم فتح واتساب لمراجعة الرسالة وإرسالها. لا يُعد الطلب مؤكداً حتى يرد المطعم.</p><button class="addwide" ${cart.length?'':'disabled'} style="width:100%" onclick="sendWhatsApp()">متابعة إلى واتساب · ${total.toFixed(2)} ${esc(cur())}</button></div>`;
  document.getElementById('cartSheet').classList.add('open');
}
function changeCartQty(i,d){if(!cart[i])return;cart[i].qty=Math.max(1,cart[i].qty+d);paintCart();openCart();}
function removeCartLine(i){cart.splice(i,1);paintCart();openCart();}

function closeCart() { document.getElementById('cartSheet').classList.remove('open'); }
function sendWhatsApp() {
  if (!cart.length) return;
  const wa = String((menuData.settings && menuData.settings.whatsapp) || '').replace(/\D/g, '');
  if (!wa) { alert('لم يُضبط رقم واتساب في إعدادات المينيو'); return; }
  const name = document.getElementById('custName').value.trim();
  const note = document.getElementById('custNote').value.trim();
  const total = cart.reduce((s, c) => s + lineTotal(c), 0);
  let msg = 'طلب جديد — ' + (menuData.settings.name || '') + '\n\n';
  if (name) msg += 'الاسم: ' + name + '\n';
  cart.forEach(c => {
    msg += '• ' + c.name + (c.size ? ' (' + c.size + ')' : '') + ' ×' + c.qty;
    (c.extras || []).forEach(e => { msg += '\n   + ' + e.name + ' ×' + e.qty; });
    msg += ' = ' + lineTotal(c) + ' ' + cur() + '\n';
  });
  if (note) msg += '\nملاحظة: ' + note + '\n';
  msg += '\nالمجموع: ' + total + ' ' + cur();
  window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), '_blank');
  document.getElementById('menuStatus').textContent='تم فتح واتساب. أرسل الرسالة لإكمال الطلب؛ بقيت السلة محفوظة للمراجعة.';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m])); }
function js(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
</script>
