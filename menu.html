<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2" />
  <title>قائمة الطعام</title>
  <meta name="theme-color" content="#b48554" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0e16;
      --card: rgba(22,30,46,0.85);
      --accent: #b48554;
      --accent-soft: #cfa776;
      --text: #f0f4fa;
      --muted: #aab7d4;
      --border: rgba(180,133,84,0.25);
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      background: radial-gradient(circle at 70% 20%, #141c2b, #0a0e16);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 100px;
    }
    header {
      background: linear-gradient(135deg, #121824, #1a1520);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px 24px;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; color: var(--accent-soft); margin-bottom: 4px; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .table-badge {
      display: inline-block;
      margin-top: 10px;
      background: rgba(180,133,84,0.15);
      border: 1px solid var(--border);
      color: var(--accent-soft);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .cat-nav {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 16px;
      scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: rgba(180,133,84,0.25);
      color: var(--accent-soft);
      border-color: var(--accent);
    }
    .items-grid { display: grid; gap: 14px; }
    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      gap: 0;
    }
    .item-img {
      width: 110px; min-height: 110px;
      object-fit: cover;
      background: rgba(180,133,84,0.08);
      flex-shrink: 0;
    }
    .item-img.placeholder {
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 1.8rem;
    }
    .item-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; }
    .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
    .item-desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; flex: 1; }
    .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .size-btn {
      background: rgba(10,14,23,0.6);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
    }
    .size-btn.active {
      background: rgba(180,133,84,0.25);
      color: var(--accent-soft);
      border-color: var(--accent);
    }
    .item-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .qty-box {
      display: flex; align-items: center; gap: 6px;
      background: rgba(10,14,23,0.5);
      border-radius: 20px;
      padding: 2px;
    }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: var(--accent);
      color: #0a0e16; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-val { min-width: 24px; text-align: center; font-weight: 700; }
    .add-btn {
      flex: 1;
      background: linear-gradient(135deg, #c9a06a, #b48554);
      color: #0a0e16;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #121824;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      gap: 12px;
    }
    .cart-bar.show { display: flex; }
    .cart-total { font-weight: 700; color: var(--accent-soft); }
    .cart-open-btn {
      background: var(--accent);
      color: #0a0e16;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #121824;
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%; max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .modal-head h2 { color: var(--accent-soft); font-size: 1.2rem; }
    .close-x {
      background: none; border: none; color: var(--muted);
      font-size: 1.6rem; cursor: pointer;
    }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .cart-item-name { font-weight: 600; }
    .cart-item-size { font-size: 0.8rem; color: var(--muted); }
    .remove-btn {
      background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .form-group { margin: 12px 0; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--muted); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(10,14,23,0.7);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }
    .send-btn {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(135deg, #c9a06a, #b48554);
      color: #0a0e16;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
    }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .empty { text-align: center; padding: 30px; color: var(--muted); }
    @media (max-width: 480px) {
      .item-img { width: 90px; min-height: 90px; }
      header h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="restName">قائمة الطعام</h1>
    <p id="restSub">جاري التحميل...</p>
    <div id="tableBadge" class="table-badge" style="display:none;"></div>
  </header>

  <div class="container">
    <div id="catNav" class="cat-nav"></div>
    <div id="itemsGrid" class="items-grid">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
    </div>
  </div>

  <div id="cartBar" class="cart-bar">
    <div class="cart-total">المجموع: <span id="cartTotal">0</span> <span id="curSym">ر.س</span></div>
    <button class="cart-open-btn" onclick="openCart()">السلة (<span id="cartCount">0</span>)</button>
  </div>

  <div id="cartModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2><i class="fas fa-shopping-bag"></i> طلبك</h2>
        <button class="close-x" onclick="closeCart()">&times;</button>
      </div>
      <div id="cartItems"></div>
      <div style="text-align:left;font-size:1.15rem;font-weight:700;margin:14px 0;color:var(--accent-soft);">
        المجموع: <span id="cartTotalModal">0</span> <span id="curSymModal">ر.س</span>
      </div>
      <div class="form-group">
        <label>ملاحظات</label>
        <textarea id="orderNotes" rows="2" placeholder="إضافة / إلغاء مكونات..."></textarea>
      </div>
      <div class="form-group">
        <label>الاسم (اختياري)</label>
        <input type="text" id="customerName" placeholder="اسمك" />
      </div>
      <div class="form-group">
        <label>الهاتف (اختياري)</label>
        <input type="tel" id="customerPhone" placeholder="05xxxxxxxx" />
      </div>
      <button class="send-btn" onclick="sendOrder()"><i class="fab fa-whatsapp"></i> إرسال الطلب</button>
    </div>
  </div>

  <script>
    // نفس رابط الـ API من النظام
    const COST_API_URL = "https://script.google.com/macros/s/AKfycbw8M72l5vC9nlcm9cyJICwOYR_zD3In_5MBgCk24NlHyHK3R_pL03ISUzUmSKXes9LZ/exec";

    let menuData = null;
    let cart = [];
    let currentCategory = 'الكل';
    let restaurantEmail = '';
    let tableNumber = '';
    let selectedSizes = {}; // itemId -> {name, price}

    const params = new URLSearchParams(location.search);
    restaurantEmail = (params.get('restaurant') || params.get('email') || '').trim().toLowerCase();
    tableNumber = params.get('table') || '';

    if (!restaurantEmail) {
      document.getElementById('itemsGrid').innerHTML = '<div class="empty">رابط غير صالح — استخدم QR المطعم</div>';
    } else {
      loadMenu();
    }

    async function loadMenu() {
      try {
        const url = new URL(COST_API_URL);
        url.searchParams.set('fn', 'getPublicMenu');
        url.searchParams.set('restaurantEmail', restaurantEmail);
        const res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'فشل التحميل');
        menuData = data;
        document.getElementById('restName').textContent = data.settings.name || 'المطعم';
        document.getElementById('restSub').textContent = data.settings.subtitle || 'قائمة الطعام';
        document.getElementById('curSym').textContent = data.settings.currency || 'ر.س';
        document.getElementById('curSymModal').textContent = data.settings.currency || 'ر.س';
        if (tableNumber) {
          const badge = document.getElementById('tableBadge');
          badge.style.display = 'inline-block';
          badge.textContent = 'طاولة ' + tableNumber;
        }
        renderCategories();
        renderItems();
      } catch (e) {
        document.getElementById('itemsGrid').innerHTML = '<div class="empty">تعذر تحميل القائمة: ' + e.message + '</div>';
      }
    }

    function renderCategories() {
      const cats = menuData.categories || ['الكل'];
      const nav = document.getElementById('catNav');
      nav.innerHTML = cats.map(c =>
        `<button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c.replace(/'/g, "\\'")}')">${c}</button>`
      ).join('');
    }

    function setCategory(c) {
      currentCategory = c;
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      let items = menuData.items || [];
      if (currentCategory !== 'الكل') {
        items = items.filter(it => it.category === currentCategory);
      }
      if (!items.length) {
        grid.innerHTML = '<div class="empty">لا توجد أصناف في هذا القسم</div>';
        return;
      }
      const cur = menuData.settings.currency || 'ر.س';
      grid.innerHTML = items.map(it => {
        const sizes = it.sizes && it.sizes.length ? it.sizes : [{ name: 'عادي', price: 0 }];
        const def = sizes[0];
        selectedSizes[it.id] = selectedSizes[it.id] || { name: def.name, price: def.price };
        const sel = selectedSizes[it.id];
        const imgHtml = it.imageUrl
          ? `<img class="item-img" src="${esc(it.imageUrl)}" alt="" onerror="this.className='item-img placeholder';this.outerHTML='<div class=\\'item-img placeholder\\'><i class=\\'fas fa-utensils\\'></i></div>'">`
          : `<div class="item-img placeholder"><i class="fas fa-utensils"></i></div>`;
        return `
          <div class="item-card" data-id="${esc(it.id)}">
            ${imgHtml}
            <div class="item-body">
              <div class="item-name">${esc(it.name)}</div>
              ${it.description ? `<div class="item-desc">${esc(it.description)}</div>` : ''}
              <div class="sizes">
                ${sizes.map(s => `
                  <button class="size-btn ${sel.name === s.name ? 'active' : ''}"
                    onclick="selectSize('${esc(it.id)}', '${esc(s.name)}', ${s.price}, this)">
                    ${esc(s.name)} · ${s.price} ${cur}
                  </button>`).join('')}
              </div>
              <div class="item-actions">
                <div class="qty-box">
                  <button class="qty-btn" onclick="chgQty('${esc(it.id)}', -1)">−</button>
                  <span class="qty-val" id="qty-${esc(it.id)}">1</span>
                  <button class="qty-btn" onclick="chgQty('${esc(it.id)}', 1)">+</button>
                </div>
                <button class="add-btn" onclick="addToCart('${esc(it.id)}')">
                  أضف — <span id="price-${esc(it.id)}">${sel.price}</span> ${cur}
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function selectSize(id, name, price, btn) {
      selectedSizes[id] = { name, price };
      const card = btn.closest('.item-card');
      card.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const pe = document.getElementById('price-' + id);
      if (pe) pe.textContent = price;
    }

    function chgQty(id, d) {
      const el = document.getElementById('qty-' + id);
      let v = parseInt(el.textContent) || 1;
      v = Math.max(1, v + d);
      el.textContent = v;
    }

    function addToCart(id) {
      const it = (menuData.items || []).find(x => x.id === id);
      if (!it) return;
      const sel = selectedSizes[id] || (it.sizes && it.sizes[0]) || { name: 'عادي', price: 0 };
      const qty = parseInt(document.getElementById('qty-' + id)?.textContent) || 1;
      const key = id + '|' + sel.name;
      const existing = cart.find(c => c.key === key);
      if (existing) existing.qty += qty;
      else cart.push({ key, id, name: it.name, size: sel.name, price: sel.price, qty });
      document.getElementById('qty-' + id).textContent = '1';
      updateCartBar();
    }

    function updateCartBar() {
      const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
      const count = cart.reduce((s, c) => s + c.qty, 0);
      document.getElementById('cartTotal').textContent = total.toFixed(2);
      document.getElementById('cartTotalModal').textContent = total.toFixed(2);
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartBar').classList.toggle('show', count > 0);
    }

    function openCart() {
      const box = document.getElementById('cartItems');
      const cur = menuData.settings.currency || 'ر.س';
      if (!cart.length) {
        box.innerHTML = '<div class="empty">السلة فارغة</div>';
      } else {
        box.innerHTML = cart.map((c, i) => `
          <div class="cart-item">
            <div>
              <div class="cart-item-name">${esc(c.name)}</div>
              ${c.size ? `<div class="cart-item-size">${esc(c.size)}</div>` : ''}
              <div style="font-size:0.9rem;color:var(--accent-soft);">${c.price} × ${c.qty} = ${(c.price * c.qty).toFixed(2)} ${cur}</div>
            </div>
            <button class="remove-btn" onclick="removeCart(${i})">حذف</button>
          </div>`).join('');
      }
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function removeCart(i) {
      cart.splice(i, 1);
      updateCartBar();
      openCart();
    }

    async function sendOrder() {
      if (!cart.length) return alert('السلة فارغة');
      const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
      const notes = document.getElementById('orderNotes').value.trim();
      const customerName = document.getElementById('customerName').value.trim();
      const customerPhone = document.getElementById('customerPhone').value.trim();
      const items = cart.map(c => ({ name: c.name, size: c.size, price: c.price, qty: c.qty }));

      // حفظ في النظام
      try {
        await fetch(COST_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8', Accept: 'application/json' },
          body: JSON.stringify({
            fn: 'savePublicOrder',
            restaurantEmail,
            items,
            total,
            notes,
            customerName,
            customerPhone,
            tableNumber
          })
        });
      } catch (e) { console.warn(e); }

      // واتساب
      const wa = (menuData.settings.whatsapp || '').replace(/[^0-9]/g, '');
      if (wa) {
        const cur = menuData.settings.currency || 'ر.س';
        let msg = `🍽️ طلب جديد\n\n`;
        if (tableNumber) msg += `الطاولة: ${tableNumber}\n`;
        if (customerName) msg += `الاسم: ${customerName}\n`;
        if (customerPhone) msg += `الهاتف: ${customerPhone}\n`;
        msg += `\n--- الأصناف ---\n`;
        items.forEach(i => {
          msg += `• ${i.name}${i.size ? ' (' + i.size + ')' : ''} ×${i.qty} = ${(i.price * i.qty).toFixed(2)} ${cur}\n`;
        });
        if (notes) msg += `\nملاحظات: ${notes}\n`;
        msg += `\n💰 المجموع: ${total.toFixed(2)} ${cur}`;
        window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, '_blank');
      } else {
        alert('تم حفظ الطلب. (لم يُضبط رقم واتساب في إعدادات المينيو)');
      }

      cart = [];
      updateCartBar();
      closeCart();
      document.getElementById('orderNotes').value = '';
      document.getElementById('customerName').value = '';
      document.getElementById('customerPhone').value = '';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    document.getElementById('cartModal').addEventListener('click', function(e) {
      if (e.target === this) closeCart();
    });
  </script>
</body>
</html>
