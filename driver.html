<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>تطبيق السائق | Mataami Pro</title>
<link rel="manifest" href="manifest-driver.json">
<link rel="icon" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:14px}
body{font-family:Tajawal,system-ui,sans-serif;background:#0b0e17;color:#e8ecf5;min-height:100vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:0 10px}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid #1f2740;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hd{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hd img{width:30px;height:30px;object-fit:contain;border-radius:8px}
.hd .t{flex:1;min-width:0;line-height:1.25}
.hd .t b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{color:#8f9bb8;font-size:.72rem}
.ib{width:34px;height:34px;border-radius:10px;background:#161c2e;color:#cbd5e1;font-size:.9rem;border:1px solid #232c45}
.shift{margin:10px 0;background:#121828;border:1px solid #232c45;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.shift .s{flex:1;line-height:1.4}.shift .s b{font-size:.95rem}.shift .s small{display:block;color:#8f9bb8;font-size:.75rem}
.dot{width:10px;height:10px;border-radius:50%;background:#64748b;flex:0 0 10px}.dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(34,197,94,.05)}}
.btn{border-radius:11px;padding:10px 14px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b-go{background:#22c55e;color:#04210f}.b-stop{background:#334155;color:#fff}.b-acc{background:#3b82f6;color:#fff;width:100%;padding:13px;font-size:1rem}
.b-done{background:#22c55e;color:#04210f;flex:2}.b-sm{background:#1b2338;color:#e2e8f0;border:1px solid #2a3452;padding:9px 10px;font-size:.8rem;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.st{background:#121828;border:1px solid #1f2740;border-radius:12px;padding:8px 4px;text-align:center}
.st b{display:block;font-size:1.05rem;color:#e6c08f}.st small{font-size:.66rem;color:#8f9bb8}
h3{font-size:.85rem;color:#a5b0cc;margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
h3 .n{background:#3b82f6;color:#fff;border-radius:20px;padding:0 8px;font-size:.75rem}
.card{background:#121828;border:1px solid #232c45;border-radius:14px;padding:12px;margin-bottom:10px}
.card.offer{border-color:#3b82f6;animation:rg 1s infinite alternate}
@keyframes rg{to{box-shadow:0 0 0 3px rgba(59,130,246,.35)}}
.card.late{border-color:#ef4444}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch .no{font-size:1.15rem;font-weight:800;color:#e6c08f}
.ch .gr{flex:1}
.tag{font-size:.7rem;padding:2px 8px;border-radius:20px;background:#1e2740;color:#cbd5e1;font-weight:700}
.tag.cod{background:rgba(245,158,11,.18);color:#fbbf24}.tag.paid{background:rgba(34,197,94,.15);color:#86efac}
.ln{display:flex;gap:8px;font-size:.84rem;line-height:1.6;margin:3px 0;word-break:break-word}
.ln i{width:14px;opacity:.55;margin-top:4px;flex:0 0 14px}
.det{background:#0d1220;border-radius:10px;padding:8px 10px;margin:8px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;font-size:.8rem}
.det div small{color:#8f9bb8;margin-inline-end:4px}
.det .full{grid-column:1/-1}
.items{font-size:.8rem;color:#cbd5e1;margin:6px 0;line-height:1.7}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tm{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:20px;background:#1e2740}
.tm.late{background:rgba(239,68,68,.2);color:#fca5a5}
.empty{text-align:center;color:#64748b;padding:26px 10px;font-size:.85rem}
.empty i{font-size:1.8rem;display:block;margin-bottom:8px;opacity:.6}
#login{max-width:360px;margin:8vh auto 0;background:#121828;border:1px solid #232c45;border-radius:16px;padding:22px 18px;display:none}
#login .lg{text-align:center;margin-bottom:14px}#login .lg i{font-size:1.6rem;color:#e6c08f;background:#1b2338;width:52px;height:52px;line-height:52px;border-radius:14px}
#login h2{font-size:1.15rem;color:#e6c08f;margin-top:8px}#login p{color:#8f9bb8;font-size:.8rem;margin-top:2px}
#login input{width:100%;padding:11px;border-radius:10px;border:1px solid #2a3452;background:#0b0e17;color:#fff;font-family:inherit;margin-bottom:8px;font-size:.95rem}
#login button{width:100%;padding:12px;border-radius:10px;background:#b48554;color:#0b0e17;font-weight:800;font-size:.95rem}
#err{color:#f87171;text-align:center;min-height:1.2em;margin-top:8px;font-size:.82rem}
#app{display:none}
.banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#fcd34d;border-radius:12px;padding:9px 11px;font-size:.78rem;margin:8px 0;line-height:1.6}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:#7f1d1d}
.foot{text-align:center;color:#475569;font-size:.68rem;margin-top:18px}
/* v4.7: العهدة وتسليم النقد */
.cashbox{background:#121828;border:1px solid #232c45;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.cashbox .row{display:flex;justify-content:space-between;font-size:.84rem;padding:3px 0;color:#cbd5e1}
.cashbox .row b{color:#e6c08f}.cashbox .row.tot{border-top:1px dashed #2a3452;margin-top:4px;padding-top:7px;font-size:.95rem}
.cashbox .row.tot b{color:#86efac;font-size:1.05rem}
.fl{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.45);border-radius:14px;padding:12px;margin:8px 0;line-height:1.7;font-size:.86rem}
.fl b{color:#93c5fd}.fl .btn{margin-top:8px;width:100%}
.fl.wait{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}.fl.wait b{color:#fcd34d}
.b-warn{background:#f59e0b;color:#1f1300}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#121828;border:1px solid #2a3452;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h4{color:#e6c08f;font-size:1.05rem;margin-bottom:10px}
.cs{display:flex;align-items:center;gap:10px;background:#0d1220;border:1px solid #2a3452;border-radius:12px;padding:10px;margin:6px 0;cursor:pointer}
.cs input{accent-color:#22c55e;width:18px;height:18px}.cs small{display:block;color:#8f9bb8;font-size:.72rem}
.sheet textarea{width:100%;background:#0b0e17;color:#fff;border:1px solid #2a3452;border-radius:10px;padding:8px;font-family:inherit;margin-top:6px}
.sheet .acts .btn{flex:1}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="lg"><i class="fas fa-motorcycle"></i><h2>تطبيق السائق</h2><p>Mataami Pro | مطعمي برو</p></div>
  <input id="lr" placeholder="رمز المطعم" dir="ltr" autocapitalize="off">
  <input id="lu" placeholder="اسم المستخدم" dir="ltr" autocomplete="username" autocapitalize="off">
  <input id="lp" placeholder="رمز PIN" type="password" inputmode="numeric" dir="ltr" autocomplete="current-password">
  <button id="lb">دخول</button>
  <div id="err"></div>
  <div data-lang-picker style="margin-top:14px"></div>
</div>
<div id="app">
  <header><div class="hd"><img id="lg" src="assets/icon-192.png" alt=""><div class="t"><b id="rn">—</b><small id="dn"></small></div>
    <button class="ib" id="snd" title="الصوت"><i class="fas fa-volume-up"></i></button><button class="ib" id="out" title="خروج"><i class="fas fa-sign-out-alt"></i></button></div></header>
  <div class="wrap">
    <div class="shift"><span class="dot" id="sd"></span><div class="s"><b id="ss">خارج الوردية</b><small id="ssub">ابدأ الوردية لاستقبال الطلبات الجاهزة</small></div><button class="btn b-go" id="sb">بدء الوردية</button></div>
    <div id="warn"></div>
    <div id="cashArea"></div>
    <div class="stats"><div class="st"><b id="t1">0</b><small>تسليم اليوم</small></div><div class="st"><b id="t2">0</b><small>متوسط (د)</small></div><div class="st"><b id="t3">0</b><small>متأخرة</small></div><div class="st"><b id="t4">0</b><small>نقد معي (عهدة+تحصيل)</small></div></div>
    <h3><i class="fas fa-bell"></i> طلبات جاهزة للاستلام <span class="n" id="on">0</span></h3><div id="offers"></div>
    <h3><i class="fas fa-route"></i> طلباتي قيد التوصيل</h3><div id="mine"></div>
    <div class="foot">© 2026 FAROUK GRUP · Mataami Pro</div>
  </div>
</div>
<script src="js/config.js?v=5.3.1"></script>
<script src="js/i18n.js?v=5.3.1"></script>
<script>
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = new URLSearchParams(location.search);
if (qs.get('r')) localStorage.setItem('drvRest', qs.get('r'));
let token = localStorage.getItem('drvToken'), email = localStorage.getItem('drvEmail');
let S = null, skew = 0, sound = localStorage.getItem('drvSound') !== '0', timer = null, geo = null, pos = null, wake = null, seen = {}, busy = false;
async function api(fn, p) {
  const body = Object.assign({ fn, restaurantEmail: email, token }, p || {});
  try { const r = await fetch(COST_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return await r.json(); }
  catch (e) { return { success: false, error: 'تعذر الاتصال — تحقق من الإنترنت', net: true }; }
}
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function showLogin(msg) { stopAll(); $('#app').style.display = 'none'; $('#login').style.display = 'block'; $('#lr').value = localStorage.getItem('drvRest') || ''; $('#err').textContent = msg || ''; }
$('#lb').onclick = async () => {
  $('#err').textContent = ''; unlockAudio();
  const r = await (await fetch(COST_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'staffLogin', restaurant: $('#lr').value.trim(), username: $('#lu').value.trim(), pin: $('#lp').value }) })).json().catch(() => ({}));
  if (r.status !== 'success') { $('#err').textContent = r.message || r.error || 'فشل الدخول'; return; }
  token = r.token; email = r.email;
  localStorage.setItem('drvToken', token); localStorage.setItem('drvEmail', email); localStorage.setItem('drvRest', $('#lr').value.trim());
  start();
};
$('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lb').click(); });

// ---------- الصوت والاهتزاز ----------
let AC = null, ringT = null;
function unlockAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } } if (AC.state === 'suspended') AC.resume().catch(() => {}); }
['click', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function ring() {
  if (navigator.vibrate) try { navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) { /* */ }
  if (!sound || !AC) return;
  [[988, 0], [1319, .18], [988, .36], [1319, .54], [1568, .72]].forEach(([f, t]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(.0001, AC.currentTime + t); g.gain.exponentialRampToValueAtTime(.45, AC.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + t + .16); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .2); });
}
function setRing(on) { if (on && !ringT) { ring(); ringT = setInterval(ring, 2200); } if (!on && ringT) { clearInterval(ringT); ringT = null; if (navigator.vibrate) try { navigator.vibrate(0); } catch (e) { /* */ } } }
$('#snd').onclick = () => { sound = !sound; localStorage.setItem('drvSound', sound ? '1' : '0'); $('#snd').innerHTML = '<i class="fas fa-volume-' + (sound ? 'up' : 'mute') + '"></i>'; if (sound) { unlockAudio(); ring(); } };
$('#snd').innerHTML = '<i class="fas fa-volume-' + (sound ? 'up' : 'mute') + '"></i>';

// ---------- الموقع وإبقاء الشاشة مضاءة ----------
function startGeo() {
  if (geo !== null || !navigator.geolocation) return;
  geo = navigator.geolocation.watchPosition(p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude }; }, () => {}, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}
function stopGeo() { if (geo !== null && navigator.geolocation) navigator.geolocation.clearWatch(geo); geo = null; }
async function keepAwake(on) {
  try { if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } if (!on && wake) { await wake.release(); wake = null; } } catch (e) { /* */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.shift) { keepAwake(true); tick(); } });
function km(a, b) { if (!a || !b || !b.lat) return null; const R = 6371, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng); const q = Math.sin(dLa / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(q)); }

// ---------- العرض ----------
const money = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
const mins = (a, b) => a ? Math.max(0, Math.round(((b ? new Date(b).getTime() : Date.now() + skew) - new Date(a).getTime()) / 60000)) : 0;
const mapUrl = a => a && a.lat ? 'https://www.google.com/maps/dir/?api=1&destination=' + a.lat + ',' + a.lng + '&travelmode=driving' : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addrLine(a));
const addrLine = a => a ? [a.city, a.district, a.street, a.complex ? 'مجمع ' + a.complex : '', a.building ? 'مبنى ' + a.building : '', a.floor ? 'طابق ' + a.floor : '', a.apartment ? 'شقة ' + a.apartment : '', a.text].filter(Boolean).join('، ') : '';
const wa = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); return 'https://wa.me/' + d; };
function payTag(o) { return o.paid ? '<span class="tag paid">مدفوع</span>' : '<span class="tag cod">تحصيل ' + money(o.total) + '</span>'; }
function offerCard(o) {
  const d = km(pos, o.address);
  return '<div class="card offer"><div class="ch"><span class="no">#' + o.number + '</span><span class="gr"></span>' + payTag(o) + '<span class="tm">' + mins(o.dispatchAt) + ' د</span></div>' +
    (o.branchName ? '<div class="ln"><i class="fas fa-store"></i><span>الاستلام من: <b>' + h(o.branchName) + '</b>' + (o.branchAddress ? ' — ' + h(o.branchAddress) : '') + '</span></div>' : '') +
    '<div class="ln"><i class="fas fa-map-marker-alt"></i><span>' + (h(o.addressLine) || 'بدون عنوان') + (d !== null ? ' <b style="color:#93c5fd">(' + d.toFixed(1) + ' كم)</b>' : '') + '</span></div>' +
    '<div class="items">' + o.items.length + ' صنف · ' + h(o.items.map(i => i.qty + '× ' + i.name).join('، ')).slice(0, 120) + '</div>' +
    '<button class="btn b-acc" data-a="acc" data-id="' + o.id + '"><i class="fas fa-hand-pointer"></i> قبول الطلب</button></div>';
}
function mineCard(o) {
  const a = o.address || {}, mx = S.maxMinutes || 30, t = mins(o.acceptedAt), late = o.dueAt && Date.now() + skew > new Date(o.dueAt).getTime();
  const det = [['المجمع', a.complex], ['المبنى', a.building], ['الطابق', a.floor], ['الشقة', a.apartment]].filter(x => x[1]);
  return '<div class="card' + (late ? ' late' : '') + '"><div class="ch"><span class="no">#' + o.number + '</span><span class="gr"></span>' + payTag(o) + '<span class="tm' + (late ? ' late' : '') + '">' + t + ' / ' + mx + ' د</span></div>' +
    '<div class="ln"><i class="fas fa-user"></i><span><b>' + h(o.customerName || 'العميل') + '</b> <span dir="ltr">' + h(o.customerPhone) + '</span></span></div>' +
    '<div class="ln"><i class="fas fa-map-marker-alt"></i><span>' + (h([a.city, a.district, a.street, a.text].filter(Boolean).join('، ')) || (a.lat ? 'موقع محدد على الخريطة' : 'بدون عنوان')) + '</span></div>' +
    (det.length || a.notes || a.landmark ? '<div class="det">' + det.map(x => '<div><small>' + x[0] + '</small><b>' + h(x[1]) + '</b></div>').join('') + (a.landmark ? '<div class="full"><small>علامة مميزة</small>' + h(a.landmark) + '</div>' : '') + (a.notes ? '<div class="full"><small>ملاحظات</small>' + h(a.notes) + '</div>' : '') + '</div>' : '') +
    '<div class="items">' + o.items.map(i => '<b>' + i.qty + '×</b> ' + h(i.name) + (i.variant ? ' (' + h(i.variant) + ')' : '')).join(' · ') + '</div>' +
    (o.notes ? '<div class="banner">' + h(o.notes) + '</div>' : '') +
    '<div class="acts"><a class="btn b-sm" href="' + h(mapUrl(a)) + '" target="_blank" rel="noopener"><i class="fas fa-location-arrow"></i> الخريطة</a>' +
    (o.customerPhone ? '<a class="btn b-sm" href="tel:' + h(o.customerPhone) + '"><i class="fas fa-phone"></i> اتصال</a><a class="btn b-sm" href="' + h(wa(o.customerPhone)) + '" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> واتساب</a>' : '') + '</div>' +
    '<div class="acts"><button class="btn b-done" data-a="done" data-id="' + o.id + '"><i class="fas fa-check-double"></i> تم التسليم' + (o.paid ? '' : ' (' + money(o.total) + ')') + '</button><button class="btn b-sm" data-a="rel" data-id="' + o.id + '" style="flex:0 0 auto"><i class="fas fa-undo"></i></button></div></div>';
}
function render() {
  if (!S) return;
  $('#rn').textContent = S.restaurantName || 'Mataami Pro'; $('#dn').textContent = 'السائق: ' + (S.name || '');
  if (S.logo) $('#lg').src = S.logo;
  const on = !!S.shift;
  $('#sd').className = 'dot' + (on ? ' on' : ''); $('#ss').textContent = on ? 'في الوردية — متصل' : 'خارج الوردية';
  const closing = on && (S.shift.status === 'closing' || S.pendingSettle);
  $('#ssub').textContent = closing ? 'بانتظار استلام الكاشير للنقد لإغلاق ورديتك' : on ? 'سيرن الجوال فور تجهيز أي طلب توصيل' : (S.requireFloat ? 'استلم العهدة من الكاشير ثم ابدأ الوردية' : 'ابدأ الوردية لاستقبال الطلبات الجاهزة');
  $('#sb').className = 'btn ' + (closing ? 'b-warn' : on ? 'b-stop' : 'b-go'); $('#sb').textContent = closing ? 'بانتظار الكاشير' : on ? 'إنهاء الوردية' : 'بدء الوردية';
  let w = '';
  if (!S.enabled) w += '<div class="banner"><i class="fas fa-info-circle"></i> خدمة التوصيل غير مفعّلة حالياً من الإدارة.</div>';
  if (on && !AC) w += '<div class="banner"><i class="fas fa-volume-up"></i> اضغط في أي مكان لتفعيل صوت التنبيه.</div>';
  if (on && !pos && navigator.geolocation) w += '<div class="banner"><i class="fas fa-location-crosshairs"></i> اسمح بالوصول للموقع لعرض المسافة ومشاركة موقعك مع الإدارة.</div>';
  $('#warn').innerHTML = w;
  $('#t1').textContent = S.today.delivered; $('#t2').textContent = S.today.avgMinutes; $('#t3').textContent = S.today.late;
  const C = S.cash || { float: 0, cod: 0, due: 0, orders: [] };
  $('#t4').textContent = money(S.cash ? C.due : S.today.cash);
  renderCash(on, C);
  $('#on').textContent = S.offers.length;
  $('#offers').innerHTML = !on ? '<div class="empty"><i class="fas fa-power-off"></i>ابدأ ورديتك لرؤية الطلبات</div>' : S.offers.length ? S.offers.map(offerCard).join('') : '<div class="empty"><i class="fas fa-mug-hot"></i>لا توجد طلبات جاهزة الآن</div>';
  $('#mine').innerHTML = S.mine.length ? S.mine.map(mineCard).join('') : '<div class="empty"><i class="fas fa-motorcycle"></i>لا توجد طلبات معك</div>';
}
// ---------- v4.7: العهدة وتسليم النقد ----------
let wasOn = null;
function renderCash(on, C) {
  let x = '';
  const pf = S.pendingFloat, ps = S.pendingSettle;
  if (pf) x += '<div class="fl"><i class="fas fa-hand-holding-usd"></i> الكاشير <b>' + h(pf.cashierName) + '</b> سلّمك عهدة (رصيد افتتاحي) بمبلغ <b>' + money(pf.amount) + '</b>.' +
    '<br>تأكّد من عدّ المبلغ ثم أكّد الاستلام' + (on ? '' : ' لبدء ورديتك') + '.' +
    '<button class="btn b-go" data-a="float" data-id="' + pf.id + '"><i class="fas fa-check"></i> استلمت ' + money(pf.amount) + (on ? ' — إضافة للعهدة' : ' — بدء الوردية') + '</button></div>';
  else if (!on && S.requireFloat) x += '<div class="fl wait"><i class="fas fa-info-circle"></i> لبدء الوردية يجب أن <b>تستلم العهدة</b> من الكاشير الموجود بالوردية. اطلب منه: شاشة الكاشير ← «عهدة السائقين» ← تسليم عهدة. ستظهر هنا للتأكيد تلقائياً.</div>';
  if (ps) x += '<div class="fl wait"><i class="fas fa-hourglass-half"></i> طلب تسليم <b>' + money(ps.amount) + '</b> مُرسل إلى الكاشير <b>' + h(ps.cashierName) + '</b>.<br>سلّمه المبلغ نقداً، وستُغلق ورديتك تلقائياً عند تأكيده الاستلام.' +
    '<button class="btn b-sm" data-a="cancelHo" style="margin-top:8px;width:100%"><i class="fas fa-times"></i> إلغاء طلب التسليم والعودة للعمل</button></div>';
  if (on) x += '<div class="cashbox"><div class="row"><span>العهدة المستلمة' + (S.shift.float_cashier ? ' (من ' + h(S.shift.float_cashier) + ')' : '') + '</span><b>' + money(C.float) + '</b></div>' +
    '<div class="row"><span>تحصيلات الدفع عند الاستلام (' + C.orders.length + ' طلب)</span><b>' + money(C.cod) + '</b></div>' +
    '<div class="row tot"><span>المطلوب تسليمه للكاشير</span><b>' + money(C.due) + '</b></div></div>';
  $('#cashArea').innerHTML = x;
}
function sheet(html) { closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sheet'; d.innerHTML = '<div class="in">' + html + '</div>'; d.addEventListener('click', e => { if (e.target === d) closeSheet(); }); document.body.appendChild(d); return d; }
function closeSheet() { const d = $('#sheet'); if (d) d.remove(); }
async function endFlow() {
  const r = await api('driverShift', { action: 'prepareEnd' });
  if (!r.success) { toast(r.error || 'تعذر التنفيذ', true); return; }
  if (r.ended) { tick(); return; }
  if (r.onWay) { toast('لديك ' + r.onWay + ' طلب قيد التوصيل — سلّمها أولاً قبل إنهاء الوردية', true); return; }
  if (!r.needHandover) {
    if (!confirm('إنهاء الوردية؟ لن تصلك طلبات جديدة.')) return;
    const e = await api('driverShift', { action: 'end' }); if (!e.success) { toast(e.error || 'تعذر التنفيذ', true); return; }
    wasOn = false; stopGeo(); keepAwake(false); toast('انتهت الوردية'); tick(); return;
  }
  const c = r.cash;
  const list = r.cashiers.length ? r.cashiers.map((k, i) => '<label class="cs"><input type="radio" name="csh" value="' + k.shiftId + '"' + (i === 0 ? ' checked' : '') + '><div><b>' + h(k.name) + '</b><small>' + h(k.branchName || '') + ' · وردية مفتوحة منذ ' + new Date(k.openedAt).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' }) + '</small></div></label>').join('')
    : '<div class="fl wait">لا يوجد كاشير بوردية مفتوحة الآن — اطلب من الكاشير فتح ورديته ثم أعد المحاولة.</div>';
  const d = sheet('<h4><i class="fas fa-cash-register"></i> تسليم النقد للكاشير وإغلاق الوردية</h4>' +
    '<div class="cashbox"><div class="row"><span>العهدة (الرصيد الافتتاحي)</span><b>' + money(c.float) + '</b></div><div class="row"><span>تحصيلات ' + c.orders.length + ' طلب دفع عند الاستلام</span><b>' + money(c.cod) + '</b></div>' +
    c.orders.map(o => '<div class="row" style="font-size:.76rem;color:#8f9bb8"><span>#' + o.number + (o.customer ? ' · ' + h(o.customer) : '') + '</span><span>' + money(o.total) + '</span></div>').join('') +
    '<div class="row tot"><span>الإجمالي المطلوب تسليمه</span><b>' + money(c.due) + '</b></div></div>' +
    '<div style="font-size:.82rem;color:#a5b0cc;margin:8px 2px">اختر الكاشير الموجود بالوردية الذي ستسلّمه المبلغ:</div>' + list +
    '<textarea id="hoNote" rows="2" placeholder="ملاحظة (اختياري)"></textarea>' +
    '<div class="acts"><button class="btn b-go" id="hoSend"' + (r.cashiers.length ? '' : ' disabled style="opacity:.5"') + '><i class="fas fa-paper-plane"></i> إرسال طلب التسليم</button><button class="btn b-sm" id="hoX">إلغاء</button></div>');
  d.querySelector('#hoX').onclick = closeSheet;
  d.querySelector('#hoSend').onclick = async () => {
    const sel = d.querySelector('input[name=csh]:checked'); if (!sel) return;
    const x = await api('driverShift', { action: 'handover', cashierShiftId: sel.value, notes: d.querySelector('#hoNote').value });
    if (!x.success) { toast(x.error || 'تعذر التنفيذ', true); return; }
    closeSheet(); setRing(false); toast('تم إرسال طلب التسليم إلى ' + x.request.cashierName + ' — سلّمه ' + money(x.request.amount)); tick();
  };
}
async function tick() {
  if (busy) return;
  const r = await api('driverState', pos ? pos : {});
  if (r.authError) { localStorage.removeItem('drvToken'); token = null; showLogin('انتهت الجلسة — سجّل الدخول مجدداً'); return; }
  if (!r.success) { if (r.planError) { showLogin(r.error); return; } if (!r.net) toast(r.error || 'خطأ', true); return; }
  S = r; skew = new Date(r.serverTime).getTime() - Date.now();
  if (wasOn === true && !r.shift) { stopGeo(); keepAwake(false); closeSheet(); toast('تم استلام النقد من الكاشير وإغلاق ورديتك — شكراً لك'); }
  wasOn = !!r.shift;
  const fresh = r.offers.filter(o => !seen[o.id]);
  r.offers.forEach(o => { seen[o.id] = 1; });
  if (fresh.length && document.hidden && 'Notification' in window && Notification.permission === 'granted') { try { new Notification('طلب توصيل جاهز', { body: 'طلب #' + fresh[0].number + ' بانتظار سائق', tag: 'drv', renotify: true }); } catch (e) { /* */ } }
  setRing(!!r.shift && r.offers.length > 0);
  render();
}
function stopAll() { clearInterval(timer); timer = null; setRing(false); stopGeo(); keepAwake(false); }
async function start() {
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  await tick();
  if (!token) return;
  if (S && S.shift) { startGeo(); keepAwake(true); }
  clearInterval(timer); timer = setInterval(tick, 5000);
}
$('#sb').onclick = async () => {
  unlockAudio();
  const on = S && S.shift;
  if (on) { if (S.shift.status === 'closing' || S.pendingSettle) { toast('طلب التسليم بانتظار تأكيد الكاشير'); return; } await endFlow(); return; }
  if (S && S.pendingFloat) { const b = document.querySelector('[data-a=float]'); if (b) b.click(); return; }
  if (S && S.requireFloat) { toast('استلم العهدة من الكاشير أولاً — ستظهر هنا للتأكيد', true); return; }
  if (!on) { startGeo(); if ('Notification' in window && Notification.permission === 'default') try { Notification.requestPermission(); } catch (e) { /* */ } }
  const r = await api('driverShift', Object.assign({ action: on ? 'end' : 'start' }, pos || {}));
  if (!r.success) { toast(r.error || 'تعذر التنفيذ', true); return; }
  if (on) { stopGeo(); keepAwake(false); setRing(false); } else keepAwake(true);
  toast(on ? 'انتهت الوردية' : 'بدأت الوردية — بانتظار الطلبات');
  tick();
};
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b || busy) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'done' && !confirm('تأكيد تسليم الطلب للعميل؟')) return;
  if (a === 'rel' && !confirm('إرجاع الطلب ليستلمه سائق آخر؟')) return;
  if (a === 'float' || a === 'cancelHo') {
    if (a === 'float' && !confirm('تأكيد استلام مبلغ العهدة من الكاشير؟')) return;
    if (a === 'cancelHo' && !confirm('إلغاء طلب التسليم؟')) return;
    busy = true; b.disabled = true;
    const on = S && S.shift;
    if (a === 'float' && !on) { startGeo(); if ('Notification' in window && Notification.permission === 'default') try { Notification.requestPermission(); } catch (e2) { /* */ } }
    const r = await api('driverShift', a === 'cancelHo' ? { action: 'cancelHandover' } : Object.assign({ action: on ? 'acceptFloat' : 'start', floatId: id }, pos || {}));
    busy = false;
    if (!r.success) toast(r.error || 'تعذر التنفيذ', true);
    else if (a === 'float') { if (!on) keepAwake(true); toast(on ? 'تمت إضافة المبلغ لعهدتك' : 'تم استلام العهدة وبدأت الوردية — بانتظار الطلبات'); }
    else toast('تم إلغاء طلب التسليم — يمكنك استقبال الطلبات');
    tick(); return;
  }
  busy = true; b.disabled = true;
  const r = await api(a === 'acc' ? 'driverAccept' : a === 'done' ? 'driverDeliver' : 'driverRelease', { id });
  busy = false;
  if (!r.success) toast(r.error || 'تعذر التنفيذ', true);
  else if (a === 'acc') { setRing(false); toast('تم قبول الطلب #' + r.order.number + ' — توجه للاستلام'); }
  else if (a === 'done') toast('تم التسليم خلال ' + Math.round(r.minutes) + ' دقيقة' + (r.late ? ' (متأخر)' : '') + (r.cod ? ' · حصّل ' + money(r.cod) : ''));
  else toast('تم إرجاع الطلب');
  tick();
});
$('#out').onclick = async () => {
  if (S && S.mine && S.mine.length) { toast('سلّم طلباتك قبل تسجيل الخروج', true); return; }
  if (!confirm('تسجيل الخروج؟')) return;
  if (S && S.shift) { const e = await api('driverShift', { action: 'end' }); if (!e.success) { toast(e.error || 'سلّم النقد للكاشير أولاً', true); return; } }
  localStorage.removeItem('drvToken'); token = null; S = null; showLogin();
};
if (token && email) start(); else showLogin();
