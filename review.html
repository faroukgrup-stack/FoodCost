<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>تقييم تجربتك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0B1C2F;
            min-height: 100vh;
            padding: 30px 20px;
            direction: rtl;
        }
        .card {
            background: rgba(15, 30, 45, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7), 0 0 0 1px rgba(196, 167, 71, 0.3) inset;
            width: 100%;
            max-width: 780px;
            padding: 45px 40px;
            margin: 0 auto;
            border: 1px solid rgba(196, 167, 71, 0.5);
        }
        .header { text-align: center; margin-bottom: 35px; }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 500;
            color: #E6E9F0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            letter-spacing: 1px;
        }
        .header h1 i { color: #C4A747; font-size: 2.8rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .header .sub {
            background: rgba(196, 167, 71, 0.15);
            color: #E0D7B0;
            padding: 10px 28px;
            border-radius: 60px;
            display: inline-block;
            font-weight: 400;
            font-size: 1.1rem;
            border: 1px solid rgba(196, 167, 71, 0.5);
            backdrop-filter: blur(4px);
            margin-top: 10px;
        }
        .header .sub i { margin-left: 10px; color: #C4A747; }
        .section {
            background: rgba(10, 25, 40, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 28px 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(196, 167, 71, 0.3);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.6);
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #E6E9F0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(196, 167, 71, 0.4);
            padding-bottom: 12px;
        }
        .section-title i { color: #C4A747; font-size: 1.8rem; width: 40px; }
        .input-field { margin-bottom: 22px; }
        .input-field label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #CAD1DB;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .input-field label i { color: #C4A747; width: 24px; }
        .input-field input,
        .input-field select,
        .input-field textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(5, 15, 25, 0.7);
            border: 1px solid #2A3A4A;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: #F0F4FA;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        .input-field input:focus,
        .input-field select:focus,
        .input-field textarea:focus {
            border-color: #C4A747;
            outline: none;
            box-shadow: 0 0 0 3px rgba(196, 167, 71, 0.3);
            background: rgba(10, 20, 35, 0.9);
        }
        .input-field input::placeholder,
        .input-field textarea::placeholder { color: #8A9AAD; font-weight: 300; }
        .rating-group { margin-bottom: 30px; }
        .rating-question {
            font-weight: 500;
            color: #E6E9F0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
        }
        .rating-question i { color: #C4A747; }
        .faces-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 10px;
            background: rgba(0, 10, 20, 0.4);
            padding: 22px 15px;
            border-radius: 60px;
            border: 1px solid rgba(196, 167, 71, 0.4);
            backdrop-filter: blur(4px);
        }
        .face-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .face-item:hover { transform: scale(1.1); }
        .face-item input[type="radio"] { display: none; }
        .face-item label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 2.8rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s;
            padding: 10px 14px;
            border-radius: 50px;
            background: transparent;
            color: #FFF;
        }
        .face-very-happy label i { color: #2ecc71; }
        .face-happy label i { color: #27ae60; }
        .face-neutral label i { color: #95a5a6; }
        .face-sad label i { color: #f39c12; }
        .face-angry label i { color: #e74c3c; }
        .face-item input[type="radio"]:checked + label {
            background: rgba(196, 167, 71, 0.25);
            box-shadow: 0 0 15px #C4A747;
            border: 1px solid #C4A747;
            padding: 9px 13px;
        }
        .face-item span { font-size: 0.8rem; color: #B0C0D0; font-weight: 300; }
        .options-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 10, 20, 0.4);
            padding: 18px;
            border-radius: 50px;
            border: 1px solid #2A3A4A;
        }
        .option-pill {
            background: rgba(15, 30, 45, 0.8);
            border: 1px solid #3A4A5A;
            border-radius: 40px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 0 auto;
            color: #CAD1DB;
            backdrop-filter: blur(4px);
        }
        .option-pill:hover {
            background: #C4A747;
            color: #0B1C2F;
            border-color: #C4A747;
        }
        .option-pill input[type="radio"],
        .option-pill input[type="checkbox"] {
            accent-color: #C4A747;
            width: 18px;
            height: 18px;
            margin-left: 8px;
        }
        .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .submit-btn {
            background: linear-gradient(145deg, #C4A747, #9F8635);
            border: none;
            border-radius: 60px;
            padding: 20px 30px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #0B1C2F;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.7);
            transition: all 0.2s;
            margin-top: 15px;
            border: 1px solid #E5D7A0;
        }
        .submit-btn i { font-size: 1.8rem; color: #0B1C2F; }
        .submit-btn:hover {
            background: linear-gradient(145deg, #D6B95A, #B29740);
            transform: scale(1.02);
            box-shadow: 0 20px 30px rgba(196, 167, 71, 0.3);
        }
        .submit-btn:disabled { opacity: 0.6; transform: none; box-shadow: none; }
        #thankYouMessage {
            display: none;
            text-align: center;
            background: rgba(46, 204, 113, 0.2);
            backdrop-filter: blur(10px);
            color: #F0FFF0;
            padding: 50px 20px;
            border-radius: 60px;
            font-size: 2.2rem;
            font-weight: 500;
            margin: 20px 0;
            border: 1px solid #2ecc71;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
        }
        #thankYouMessage i { font-size: 5rem; display: block; margin-bottom: 15px; color: #2ecc71; }
        #errorMessage {
            display: none;
            text-align: center;
            background: rgba(231, 76, 60, 0.2);
            backdrop-filter: blur(10px);
            color: #FFD0D0;
            padding: 15px;
            border-radius: 60px;
            margin-top: 20px;
            font-weight: 500;
            border: 1px solid #e74c3c;
        }
        .restaurant-name-badge {
            display: inline-block;
            background: rgba(196, 167, 71, 0.25);
            color: #E0D7B0;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            border: 1px solid #C4A747;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            .card, .section, .faces-container, .options-wrapper, .option-pill,
            .input-field input, .input-field select, .input-field textarea,
            .header .sub, #thankYouMessage, #errorMessage {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            .card { background: #0D1F31; box-shadow: 0 10px 20px rgba(0,0,0,0.5); padding: 25px 15px; border-radius: 30px; }
            .section { background: #091726; box-shadow: none; padding: 20px 15px; border-radius: 20px; }
            .faces-container, .options-wrapper { background: #07121F; border-radius: 30px; }
            .input-field input, .input-field select, .input-field textarea { background: #060E18; }
            .header h1 { font-size: 2rem; }
            .face-item label { font-size: 2.2rem; padding: 8px 10px; }
            .option-pill { padding: 10px 16px; font-size: 0.9rem; background: #0A192A; }
            .section-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1><i class="fas fa-crown"></i> رأيك يهمنا <i class="fas fa-star"></i></h1>
        <div class="sub"><i class="fas fa-clock"></i> دقيقة واحدة وتصنع الفرق!</div>
        <div id="restaurantNameDisplay" class="restaurant-name-badge">🏠 مطعمنا</div>
    </div>

    <form id="feedbackForm">
        <div class="section">
            <div class="section-title"><i class="fas fa-user-circle"></i> معلومات التواصل (اختياري)</div>
            <div class="input-field"><label><i class="fas fa-user"></i> الاسم الكريم</label><input type="text" name="الاسم" placeholder="الاسم الكريم"></div>
            <div class="input-field"><label><i class="fas fa-phone-alt"></i> رقم الهاتف</label><input type="tel" name="رقم_الهاتف" placeholder="05xxxxxxxx"></div>
        </div>

        <div class="section">
            <div class="section-title"><i class="fas fa-calendar-alt"></i> تفاصيل الزيارة</div>
            <div class="input-field"><label><i class="fas fa-clock"></i> تاريخ الزيارة</label><input type="date" name="تاريخ_الزيارة"></div>
            <div class="input-field"><label><i class="fas fa-users"></i> عدد الأشخاص</label>
                <select name="عدد_الأشخاص"><option value="">اختر</option><option value="1">شخص واحد</option><option value="2">شخصان</option><option value="3-4">٣-٤ أشخاص</option><option value="5+">٥ أشخاص فأكثر</option></select>
            </div>
            <div class="input-field"><label><i class="fas fa-sun"></i> نوع الزيارة</label>
                <div class="options-wrapper"><label class="option-pill"><input type="radio" name="نوع_الزيارة" value="غداء"> <i class="fas fa-sun"></i> غداء</label><label class="option-pill"><input type="radio" name="نوع_الزيارة" value="عشاء"> <i class="fas fa-moon"></i> عشاء</label><label class="option-pill"><input type="radio" name="نوع_الزيارة" value="طلبات_خارجية"> <i class="fas fa-shopping-bag"></i> طلبات خارجية</label></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title"><i class="fas fa-face-smile"></i> قيّم تجربتك</div>

            <div class="rating-group"><div class="rating-question"><i class="fas fa-hamburger"></i> جودة ومذاق الطعام</div>
                <div class="faces-container">
                    <div class="face-item face-very-happy"><input type="radio" name="تقييم_الطعام" value="5" id="food_5" required><label for="food_5"><i class="fa-regular fa-face-laugh-beam"></i><span>ممتاز</span></label></div>
                    <div class="face-item face-happy"><input type="radio" name="تقييم_الطعام" value="4" id="food_4"><label for="food_4"><i class="fa-regular fa-face-smile"></i><span>جيد</span></label></div>
                    <div class="face-item face-neutral"><input type="radio" name="تقييم_الطعام" value="3" id="food_3"><label for="food_3"><i class="fa-regular fa-face-meh"></i><span>مقبول</span></label></div>
                    <div class="face-item face-sad"><input type="radio" name="تقييم_الطعام" value="2" id="food_2"><label for="food_2"><i class="fa-regular fa-face-frown"></i><span>سيء</span></label></div>
                    <div class="face-item face-angry"><input type="radio" name="تقييم_الطعام" value="1" id="food_1"><label for="food_1"><i class="fa-regular fa-face-angry"></i><span>سيء جداً</span></label></div>
                </div>
            </div>

            <div class="rating-group"><div class="rating-question"><i class="fas fa-concierge-bell"></i> سرعة ولطافة الخدمة</div>
                <div class="faces-container">
                    <div class="face-item face-very-happy"><input type="radio" name="تقييم_الخدمة" value="5" id="service_5" required><label for="service_5"><i class="fa-regular fa-face-laugh-beam"></i><span>ممتاز</span></label></div>
                    <div class="face-item face-happy"><input type="radio" name="تقييم_الخدمة" value="4" id="service_4"><label for="service_4"><i class="fa-regular fa-face-smile"></i><span>جيد</span></label></div>
                    <div class="face-item face-neutral"><input type="radio" name="تقييم_الخدمة" value="3" id="service_3"><label for="service_3"><i class="fa-regular fa-face-meh"></i><span>مقبول</span></label></div>
                    <div class="face-item face-sad"><input type="radio" name="تقييم_الخدمة" value="2" id="service_2"><label for="service_2"><i class="fa-regular fa-face-frown"></i><span>سيء</span></label></div>
                    <div class="face-item face-angry"><input type="radio" name="تقييم_الخدمة" value="1" id="service_1"><label for="service_1"><i class="fa-regular fa-face-angry"></i><span>سيء جداً</span></label></div>
                </div>
            </div>

            <div class="rating-group"><div class="rating-question"><i class="fas fa-broom"></i> نظافة المكان والأجواء</div>
                <div class="faces-container">
                    <div class="face-item face-very-happy"><input type="radio" name="تقييم_النظافة" value="5" id="clean_5" required><label for="clean_5"><i class="fa-regular fa-face-laugh-beam"></i><span>ممتاز</span></label></div>
                    <div class="face-item face-happy"><input type="radio" name="تقييم_النظافة" value="4" id="clean_4"><label for="clean_4"><i class="fa-regular fa-face-smile"></i><span>جيد</span></label></div>
                    <div class="face-item face-neutral"><input type="radio" name="تقييم_النظافة" value="3" id="clean_3"><label for="clean_3"><i class="fa-regular fa-face-meh"></i><span>مقبول</span></label></div>
                    <div class="face-item face-sad"><input type="radio" name="تقييم_النظافة" value="2" id="clean_2"><label for="clean_2"><i class="fa-regular fa-face-frown"></i><span>سيء</span></label></div>
                    <div class="face-item face-angry"><input type="radio" name="تقييم_النظافة" value="1" id="clean_1"><label for="clean_1"><i class="fa-regular fa-face-angry"></i><span>سيء جداً</span></label></div>
                </div>
            </div>

            <div class="rating-group"><div class="rating-question"><i class="fas fa-tags"></i> الأسعار مناسبة للجودة</div>
                <div class="faces-container">
                    <div class="face-item face-very-happy"><input type="radio" name="تقييم_الاسعار" value="5" id="price_5"><label for="price_5"><i class="fa-regular fa-face-laugh-beam"></i><span>ممتاز</span></label></div>
                    <div class="face-item face-happy"><input type="radio" name="تقييم_الاسعار" value="4" id="price_4"><label for="price_4"><i class="fa-regular fa-face-smile"></i><span>جيد</span></label></div>
                    <div class="face-item face-neutral"><input type="radio" name="تقييم_الاسعار" value="3" id="price_3"><label for="price_3"><i class="fa-regular fa-face-meh"></i><span>مقبول</span></label></div>
                    <div class="face-item face-sad"><input type="radio" name="تقييم_الاسعار" value="2" id="price_2"><label for="price_2"><i class="fa-regular fa-face-frown"></i><span>سيء</span></label></div>
                    <div class="face-item face-angry"><input type="radio" name="تقييم_الاسعار" value="1" id="price_1"><label for="price_1"><i class="fa-regular fa-face-angry"></i><span>سيء جداً</span></label></div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title"><i class="fas fa-thumbs-up"></i> أخبرنا المزيد</div>

            <div class="input-field"><label><i class="fas fa-ice-cream"></i> ما الأطباق التي أعجبتك؟ (اختياري)</label>
                <div class="checkbox-grid"><label class="option-pill"><input type="checkbox" name="الأطباق_المفضلة" value="مقبلات"> مقبلات</label><label class="option-pill"><input type="checkbox" name="الأطباق_المفضلة" value="سلطات"> سلطات</label><label class="option-pill"><input type="checkbox" name="الأطباق_المفضلة" value="أطباق رئيسية"> أطباق رئيسية</label><label class="option-pill"><input type="checkbox" name="الأطباق_المفضلة" value="حلويات"> حلويات</label><label class="option-pill"><input type="checkbox" name="الأطباق_المفضلة" value="مشروبات"> مشروبات</label></div>
            </div>

            <div class="input-field"><label><i class="fas fa-share-alt"></i> هل تنصح أصدقائك بزيارة مطعمنا؟</label>
                <div class="options-wrapper"><label class="option-pill"><input type="radio" name="توصية" value="أكيد"> <i class="fas fa-smile"></i> أكيد</label><label class="option-pill"><input type="radio" name="توصية" value="ربما"> <i class="fas fa-meh"></i> ربما</label><label class="option-pill"><input type="radio" name="توصية" value="لا"> <i class="fas fa-frown"></i> لا</label></div>
            </div>

            <div class="input-field"><label><i class="fas fa-pen"></i> اقتراحات أو شكاوى إضافية</label><textarea name="الملاحظات_والاقتراحات" rows="3" placeholder="نحن نقرأ كل كلمة... شكراً لك"></textarea></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> إرسال التقييم</button>
        <div id="errorMessage"><i class="fas fa-exclamation-circle"></i> حدث خطأ، يرجى المحاولة مرة أخرى.</div>
    </form>

    <div id="thankYouMessage"><i class="fas fa-check-circle"></i> شكراً جزيلاً! <br> تم استلام تقييمك بنجاح. نتمنى رؤيتك قريباً 🌟</div>
</div>

<script>
    (function() {
        // ===== 1. قراءة معاملات URL =====
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantEmail = urlParams.get('restaurant') || '';
        const restaurantName = urlParams.get('name') || 'مطعمنا';

        // عرض اسم المطعم في البطاقة
        const nameDisplay = document.getElementById('restaurantNameDisplay');
        if (nameDisplay && restaurantName) {
            nameDisplay.textContent = '🏠 ' + restaurantName;
        }

        // ===== 2. عنوان السيرفر =====
        const API_URL = 'https://script.google.com/macros/s/AKfycbxA8ZkqZXFhWAHEqc7Ao1-uK8OqQ1q9Grb8x1alrULM22rjPgd8XfIC0TLpYkQGDJ-m/exec';
        const form = document.getElementById('feedbackForm');

        // ===== 3. معالجة الإرسال (باستخدام URLSearchParams) =====
        const thankYouDiv = document.getElementById('thankYouMessage');
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        async function handleSubmit(event) {
            event.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري الإرسال...';

            // --- جمع البيانات من النموذج ---
            const formData = new FormData(form);
            const data = {};

            for (let [key, value] of formData.entries()) {
                if (key === 'الأطباق_المفضلة') {
                    if (!data[key]) data[key] = [];
                    data[key].push(value);
                } else {
                    data[key] = value;
                }
            }

            // تحويل قائمة الأطباق المفضلة إلى نص
            if (data['الأطباق_المفضلة'] && Array.isArray(data['الأطباق_المفضلة'])) {
                data['الأطباق_المفضلة'] = data['الأطباق_المفضلة'].join('، ');
            }

            // إضافة البريد الإلكتروني واسم المطعم
            if (restaurantEmail) data['restaurantEmail'] = restaurantEmail;
            if (restaurantName) data['restaurantName'] = restaurantName;

            // حساب التقييم العام
            const food = parseFloat(data['تقييم_الطعام']);
            const service = parseFloat(data['تقييم_الخدمة']);
            const clean = parseFloat(data['تقييم_النظافة']);
            const price = parseFloat(data['تقييم_الاسعار']);

            const ratings = [food, service, clean, price].filter(v => !isNaN(v));

            if (ratings.length > 0) {
                const sum = ratings.reduce((a, b) => a + b, 0);
                const avg = (sum / ratings.length).toFixed(1);
                data['التقييم_العام'] = avg;
                let customerStatus = '';
                if (avg <= 2.5) customerStatus = 'غير راضي ❌';
                else if (avg <= 3.5) customerStatus = 'محايد ⚠️';
                else customerStatus = 'راضي ✅';
                data['تصنيف_العميل'] = customerStatus;
            }

            // ===== إضافة fn=submitReview =====
            data['fn'] = 'submitReview';

            // ===== تحويل البيانات إلى URLSearchParams =====
            const searchParams = new URLSearchParams(data);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: searchParams.toString()
                });

                const result = await response.json();

                if (result.status === 'success') {
                    form.style.display = 'none';
                    thankYouDiv.style.display = 'block';
                    errorDiv.style.display = 'none';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showError(result.message || 'حدث خطأ في السيرفر');
                }
            } catch (error) {
                console.error('Network error:', error);
                showError('تعذر الاتصال بالسيرفر. يرجى المحاولة لاحقاً.');
            }

            function showError(msg) {
                errorDiv.textContent = msg || 'حدث خطأ، يرجى المحاولة مرة أخرى.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال التقييم';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 8000);
            }
        }

        form.addEventListener('submit', handleSubmit);

        if (!restaurantEmail) {
            console.warn('⚠️ لم يتم توفير بريد إلكتروني للمطعم. سيتم تخزين التقييم في جدول افتراضي.');
        }
    })();
</script>

</body>
</html>
