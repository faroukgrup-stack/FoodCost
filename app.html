<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow"><!-- v5.3.3: صفحة تشغيلية/خاصة بكل مطعم — لا تُفهرس -->
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e17" id="themeColor">
<title>تطبيق المطعم</title>
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#b48554;--bg:#0b0e17}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:#f1f5f9;min-height:100vh;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{padding:34px 0 22px;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;background:transparent;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
h1{font-size:1.6rem}.welcome{color:#cbd5e1;margin-top:6px;line-height:1.7}
.banner{width:100%;border-radius:18px;margin:6px 0 16px;aspect-ratio:16/7;object-fit:cover}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px 14px;text-align:center;cursor:pointer;color:inherit;text-decoration:none;display:block;font-family:inherit;font-size:1rem;width:100%}
.tile i{font-size:1.7rem;color:var(--c);display:block;margin-bottom:8px}
.tile b{display:block}.tile small{color:#94a3b8;font-size:.8rem}
.tile.inst{grid-column:1/-1;border:1px dashed var(--c)}
.tile.big{grid-column:1/-1;background:var(--c);color:#0b0e17;border:0}.tile.big i{color:#0b0e17}.tile.big small{color:rgba(0,0,0,.65)}
.contact{display:flex;justify-content:center;gap:12px;margin:22px 0}
.contact a{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:var(--c);font-size:1.3rem;text-decoration:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.box{background:#121726;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 18px 30px;max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.box h2{font-size:1.25rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:#94a3b8;font-size:1.5rem;cursor:pointer}
label{display:block;font-size:.88rem;color:#cbd5e1;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #2a334b;background:#0b0e17;color:#fff;font-family:inherit;font-size:1rem}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--c);color:#0b0e17;font-weight:800;font-family:inherit;font-size:1rem;margin-top:16px;cursor:pointer}
.res{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);line-height:1.8;text-align:center}
.res.err{color:#fca5a5}.res.ok{color:#86efac}
.pts{font-size:2.6rem;font-weight:800;color:var(--c)}
.steps{display:flex;justify-content:space-between;margin:16px 0 6px}
.steps div{flex:1;text-align:center;font-size:.8rem;color:#64748b}
.steps div i{display:flex;width:40px;height:40px;margin:0 auto 6px;border-radius:50%;align-items:center;justify-content:center;background:#1e2537}
.steps div.on{color:#fff}.steps div.on i{background:var(--c);color:#0b0e17}
#install{position:fixed;bottom:16px;left:16px;right:16px;max-width:528px;margin:0 auto;background:#fff;color:#0b0e17;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:15}
#install b{flex:1}#install button{border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:800;background:var(--c);color:#0b0e17;cursor:pointer}
#install .no{background:#e2e8f0}
.loading{text-align:center;padding:30vh 20px;color:#94a3b8}
footer{text-align:center;color:#475569;font-size:.75rem;margin-top:20px}
.acc-card{background:linear-gradient(135deg,var(--c),#0b0e17 140%);border-radius:22px;padding:18px;color:#0b0e17;text-align:center;margin-bottom:14px}
.acc-card .qr{background:#fff;border-radius:16px;padding:10px;display:inline-block;margin:10px 0}.acc-card .qr img{width:210px;height:210px;display:block}
.acc-card .code{font-family:monospace;font-weight:800;letter-spacing:2px;direction:ltr}
.acc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.acc-row div{background:rgba(255,255,255,.05);border-radius:14px;padding:12px;text-align:center}.acc-row b{display:block;font-size:1.5rem;color:var(--c)}
.acc-sec{margin-top:16px}.acc-sec h3{font-size:1rem;margin-bottom:8px;color:#cbd5e1}
.acc-item{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;margin-bottom:8px;line-height:1.7;font-size:.92rem}.acc-item.new{border-inline-start:4px solid var(--c)}
.acc-item small{color:#94a3b8}.acc-item .cp{font-family:monospace;background:#0b0e17;padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block}
.dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font-size:.75rem;line-height:20px;padding:0 6px;margin-inline-start:6px}
.lnk{background:none;border:0;color:var(--c);font-family:inherit;cursor:pointer;font-size:.9rem;margin-top:12px}
/* v4.5 عرض مضغوط ومريح على الجوال */
@media(max-width:600px){
body{font-size:14px}.wrap{padding:0 12px}.hero{padding:20px 0 12px}.logo{width:62px;height:62px;margin-bottom:8px}
h1{font-size:1.2rem}.welcome{font-size:.85rem;margin-top:4px}.banner{border-radius:14px;margin:4px 0 10px}
.tiles{gap:8px}.tile{padding:12px 10px;border-radius:14px;font-size:.88rem}.tile i{font-size:1.25rem;margin-bottom:5px}.tile small{font-size:.72rem}
.contact{gap:10px;margin:14px 0}.contact a{width:42px;height:42px;font-size:1.05rem}
.box{padding:16px 14px 22px;border-radius:18px 18px 0 0}.box h2{font-size:1.05rem;margin-bottom:10px}
label{font-size:.8rem;margin:8px 0 4px}input,select,textarea{padding:10px;border-radius:10px;font-size:.95rem}.btn{padding:11px;border-radius:12px;font-size:.92rem;margin-top:12px}
.acc-card{padding:14px;border-radius:18px}.acc-card .qr img{width:170px;height:170px}.acc-row b{font-size:1.2rem}.acc-item{font-size:.84rem;padding:8px 10px}
.pts{font-size:2rem}.steps div i{width:32px;height:32px}
}
/* v5.0 واجهة العميل الجديدة (ترحيب + QR + بطاقة النقاط + بلاطات + العروض) */
body.v5{padding-bottom:30px}
.v5h{position:relative;margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 16px 46px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#000) 0%,color-mix(in srgb,var(--c) 22%,var(--bg)) 70%,var(--bg) 100%);border-radius:0 0 26px 26px}
.v5top{display:flex;align-items:center;gap:12px}
.v5top img{width:46px;height:46px;border-radius:14px;object-fit:contain;background:transparent;padding:0}
.v5top .rn{flex:1;min-width:0}.v5top .rn b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v5top .rn small{color:rgba(255,255,255,.7);font-size:.72rem}
.v5qr{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;color:#0b0e17;border:0;font-size:1.25rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);flex:none}
.v5hi{margin-top:18px}.v5hi small{color:rgba(255,255,255,.75);font-size:.9rem}.v5hi h1{font-size:1.45rem;margin-top:2px;line-height:1.3}
.v5card{position:relative;margin-top:-30px;background:#151b2b;border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);cursor:pointer}
.v5ring{width:84px;height:84px;flex:none;position:relative}.v5ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.v5ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.v5ring .t b{font-size:1.25rem;color:var(--c)}.v5ring .t small{font-size:.62rem;color:#94a3b8}
.v5pi{flex:1;min-width:0;line-height:1.6}.v5pi b{font-size:1rem}.v5pi .v{color:var(--c);font-weight:800;font-size:1.05rem}.v5pi small{display:block;color:#94a3b8;font-size:.76rem}
.v5stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.v5stats div{background:rgba(255,255,255,.04);border-radius:14px;padding:9px 6px;text-align:center;font-size:.72rem;color:#94a3b8}.v5stats b{display:block;color:#fff;font-size:1rem}
.v5big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.v5t{position:relative;border-radius:18px;padding:14px 12px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:#fff;border:0;font-family:inherit;text-align:start;cursor:pointer;overflow:hidden;background:#1a2133}
.v5t.p{background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#000))}.v5t.p,.v5t.p small{color:#0b0e17}
.v5t i{position:absolute;top:12px;inset-inline-end:12px;font-size:1.7rem;opacity:.9}.v5t b{font-size:.98rem}.v5t small{font-size:.72rem;color:#94a3b8}
.v5ic{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.v5ic a,.v5ic button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 4px;color:#e2e8f0;text-decoration:none;font-family:inherit;font-size:.7rem;text-align:center;cursor:pointer;position:relative}
.v5ic i{display:block;font-size:1.15rem;color:var(--c);margin-bottom:5px}
.v5sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.v5sec b{font-size:1rem}.v5sec small{color:#94a3b8;font-size:.75rem}
.v5car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.v5car::-webkit-scrollbar{display:none}
.v5car>*{scroll-snap-align:start;flex:0 0 82%;border-radius:18px;overflow:hidden;background:#1a2133}
.v5car img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.v5off{padding:14px;min-height:110px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 35%,#151b2b),#151b2b)}.v5off b{font-size:1rem}.v5off .big{font-size:1.5rem;font-weight:800;color:var(--c)}.v5off small{color:#cbd5e1;font-size:.75rem}
.v5login{margin-top:-30px;position:relative;background:#151b2b;border:1px dashed var(--c);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.v5login i{font-size:1.6rem;color:var(--c)}.v5login div{flex:1;line-height:1.5}.v5login small{color:#94a3b8;font-size:.76rem;display:block}
.v5qrs{text-align:center}.v5qrs .q{background:#fff;border-radius:20px;padding:14px;display:inline-block;margin:6px 0 10px}.v5qrs .q img{width:min(64vw,250px);height:min(64vw,250px);display:block}
.v5qrs .code{font-family:monospace;font-weight:800;letter-spacing:2px;direction:ltr;font-size:1.05rem}
@media(max-width:600px){.v5h{margin:0 -12px;padding-left:12px;padding-right:12px}.v5car{margin:0 -12px;padding:0 12px 4px}.v5hi h1{font-size:1.3rem}}
.acc-item.dlv{border-inline-start-color:#22c55e;background:rgba(34,197,94,.08)}.acc-item.dlv i{color:#22c55e}
.v5lang{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:inherit;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:1rem;cursor:pointer;flex:none}
.v5lang i{color:var(--c)}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="loading">جاري التحميل...</div></div>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div id="install"><b id="instTxt">ثبّت التطبيق على جوالك</b><button id="instBtn">تثبيت</button><button class="no" id="instNo">لاحقاً</button></div>
<script src="js/config.js?v=5.4.3"></script>
<script src="js/i18n.js?v=5.4.3"></script>
<script src="js/domain.js?v=5.4.3"></script>
<script src="js/cust-delivery.js?v=5.4.3"></script>
<script>
const qs = new URLSearchParams(location.search), R = (qs.get('r') || localStorage.getItem('appLastR') || '').trim().toLowerCase();
if (R) try { localStorage.setItem('appLastR', R); } catch (e) {}
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let C = null, deferred = null, ME = null, meT = null;
const CT_KEY = 'appCustToken_' + R;
const ct = () => localStorage.getItem(CT_KEY) || '';
async function api(fn, p) { return (await fetch(COST_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ fn, r: R }, p || {})) })).json(); }
function base() { return location.href.replace(/[^/]*(\?.*)?$/, ''); }
function setManifest() {
  const icon = C.icon || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="' + (C.color || '#b48554') + '"/><text x="256" y="330" font-size="260" text-anchor="middle" fill="#0b0e17" font-family="Arial" font-weight="bold">' + h((C.shortName || C.name || 'R').trim().charAt(0)) + '</text></svg>');
  const m = { name: C.name, short_name: (C.shortName || C.name).slice(0, 14), start_url: base() + 'app.html?r=' + encodeURIComponent(R), scope: base(), display: 'standalone', dir: 'rtl', lang: 'ar', background_color: C.bg || '#0b0e17', theme_color: C.color || '#b48554',
    icons: [{ src: icon, sizes: '192x192', purpose: 'any' }, { src: icon, sizes: '512x512', purpose: 'any maskable' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = COST_API_URL + (COST_API_URL.indexOf('?') >= 0 ? '&' : '?') + 'fn=appManifest&r=' + encodeURIComponent(R) + '&base=' + encodeURIComponent(base()) + '&api=' + encodeURIComponent(typeof COST_API_BASE === 'string' ? COST_API_BASE : COST_API_URL.split('?')[0]); document.head.appendChild(l);
  void m;
  $('#appleIcon').href = C.icon || (base() + 'assets/apple-touch-icon.png'); $('#favIcon').href = C.icon || (base() + 'assets/favicon-64.png'); $('#themeColor').content = C.bg || '#0b0e17';
}
function menuUrl() { return base() + 'menu.html?r=' + encodeURIComponent(R); }
function render() {
  document.documentElement.style.setProperty('--c', C.color || '#b48554'); document.documentElement.style.setProperty('--bg', C.bg || '#0b0e17');
  document.title = C.name; document.body.classList.add('v5');
  const f = C.features || {}, wa = String(C.whatsapp || C.phone || '').replace(/\D/g, ''), cur = h(C.currency || '');
  const logo = h(C.icon || (base() + 'assets/icon-512.png'));
  const hour = new Date().getHours(), greet = hour < 12 ? 'صباح الخير' : hour < 18 ? 'مرحباً بك' : 'مساء الخير';
  let card = '';
  if (f.account && ME) {
    const need = +ME.minRedeem || 0, pts = +ME.points || 0, pr = need ? Math.min(1, pts / need) : (pts > 0 ? 1 : 0), dash = 2 * Math.PI * 34;
    card = '<div class="v5card" data-o="acc"><div class="v5ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--c)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + '" stroke-dashoffset="' + (dash * (1 - pr)).toFixed(1) + '"/></svg><div class="t"><b>' + pts + '</b><small>نقطة</small></div></div>' +
      '<div class="v5pi"><b>رصيد نقاطك</b><div>قيمة الاستبدال: <span class="v">' + h(ME.value) + ' ' + cur + '</span></div><small>' + (need ? (pts >= need ? 'يمكنك استبدال نقاطك الآن عند الكاشير' : 'باقي ' + (need - pts) + ' نقطة لتتمكن من الاستبدال') : 'اعرض رمز QR عند الدفع لتجمع النقاط') + '</small></div></div>' +
      '<div class="v5stats"><div><b>' + (ME.visits || 0) + '</b>زيارة</div><div><b>' + h(ME.totalSpent || 0) + '</b>مشترياتك ' + cur + '</div><div><b>' + ((ME.offers || []).length + (ME.giftCards || []).length) + '</b>عروض وبطاقات</div></div>';
  } else if (f.account) card = '<div class="v5login" data-o="acc"><i class="fas fa-id-card"></i><div><b>سجّل دخولك برقم جوالك</b><small>احصل على رمز QR خاص، اجمع النقاط واستبدلها، واستلم العروض</small></div><i class="fas fa-chevron-left" style="font-size:1rem"></i></div>';
  const offers = [].concat((C.banners || []).map(b => '<div><img src="' + h(b) + '" alt="" loading="lazy"></div>'),
    ((ME && ME.offers) || []).map(o => '<div class="v5off"><b>' + h(o.name) + '</b><div class="big">' + (o.kind === 'percent' ? o.value + '%' : o.value + ' ' + cur) + '</div><small>الكود: <b dir="ltr">' + h(o.code) + '</b>' + (o.ends_at ? ' · حتى ' + String(o.ends_at).slice(0, 10) : '') + '</small></div>'));
  const icons = [f.loyalty && !ME ? '<button data-o="loy"><i class="fas fa-gift"></i>نقاطي</button>' : '', f.orderStatus ? '<button data-o="st"><i class="fas fa-receipt"></i>حالة طلبي</button>' : '',
    C.googleReview ? '<a href="' + h(C.googleReview) + '" target="_blank" rel="noopener"><i class="fab fa-google"></i>قيّمنا</a>' : '', C.maps ? '<a href="' + h(C.maps) + '" target="_blank" rel="noopener"><i class="fas fa-map-marker-alt"></i>موقعنا</a>' : '',
    C.phone ? '<a href="tel:' + h(C.phone) + '"><i class="fas fa-phone"></i>اتصال</a>' : '', wa ? '<a href="https://wa.me/' + wa + '" target="_blank"><i class="fab fa-whatsapp"></i>واتساب</a>' : '',
    C.instagram ? '<a href="' + h(C.instagram) + '" target="_blank"><i class="fab fa-instagram"></i>إنستغرام</a>' : '', isStandalone() ? '' : '<button data-o="inst" class="inst"><i class="fas fa-mobile-screen-button"></i>تثبيت</button>'].filter(Boolean);
  $('#root').innerHTML = '<div class="v5h"><div class="v5top"><img src="' + logo + '" alt=""><div class="rn"><b>' + h(C.name) + '</b>' + (C.welcome ? '<small>' + h(C.welcome).slice(0, 60) + '</small>' : '') + '</div>' +
      '<button class="v5lang" data-lang-btn></button>' + (f.account ? '<button class="v5qr" data-o="qr" aria-label="رمز QR">' + '<i class="fas fa-qrcode"></i>' + (ME && ME.unread ? '<span class="dot" style="position:absolute;top:-4px;inset-inline-end:-4px;margin:0">' + ME.unread + '</span>' : '') + '</button>' : '') + '</div>' +
      '<div class="v5hi"><small>' + greet + '،</small><h1>' + (ME ? h(ME.name) : 'ضيفنا العزيز') + '</h1></div></div>' +

  } catch (e) { $('#root').innerHTML = '<div class="loading">تعذر الاتصال، حاول مجدداً</div>'; }
})();
</script>
