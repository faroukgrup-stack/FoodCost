<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل أو تجديد الاشتراك | FAROUK GRUP</title>
    <meta name="description" content="اشتراك جديد أو تجديد اشتراكك في نظام إدارة التكلفة وهندسة المنيو من مجموعة فاروق للإستشارات والأعمال.">
    <meta name="robots" content="noindex, follow">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* ===== نفس الأنماط السابقة ===== */
        :root {
            --gold: #b8860b;
            --gold-light: #d4b15a;
            --gold-soft: rgba(184, 134, 11, 0.08);
            --dark: #0f0f0f;
            --dark-light: #1a1a1a;
            --grey: #333;
            --light: #f5f5f5;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 70% 30%, #1a1f2b, #0a0d14);
            color: #f0f4fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite;
        }
        body::before {
            top: -120px;
            right: -120px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
        }
        body::after {
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 177, 90, 0.05) 0%, transparent 70%);
            animation-duration: 10s;
            animation-direction: reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px, -25px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.94); }
        }

        .mini-nav {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mini-nav .logo-sm {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--gold-light);
            font-family: 'Alexandria', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(18, 24, 36, 0.75);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(184, 134, 11, 0.25);
            transition: all 0.35s ease;
        }
        .mini-nav .logo-sm img {
            height: 28px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }
        .mini-nav .logo-sm:hover {
            background: rgba(184, 134, 11, 0.2);
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 4px 18px rgba(184, 134, 11, 0.3);
            transform: translateY(-2px);
        }

        .sub-card {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 2.8rem 2.2rem;
            background: rgba(15, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(184, 134, 11, 0.22);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(184, 134, 11, 0.08) inset;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
            margin: 100px 0 60px;
        }
        .sub-card:hover {
            border-color: rgba(184, 134, 11, 0.45);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(184, 134, 11, 0.06), 0 0 0 1px rgba(184, 134, 11, 0.12) inset;
        }
        .sub-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            right: 30px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            border-radius: 0 0 3px 3px;
            opacity: 0.8;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 85px;
            margin: 0 auto 1.2rem;
            background: rgba(184, 134, 11, 0.1);
            border: 2px solid rgba(184, 134, 11, 0.35);
            border-radius: 50%;
            position: relative;
            animation: pulseIcon 2.5s ease-in-out infinite;
        }
        .icon-wrapper i {
            font-size: 2.4rem;
            color: var(--gold-light);
            z-index: 1;
            transition: transform 0.3s ease;
        }
        .icon-wrapper:hover i {
            transform: scale(1.15) rotate(-5deg);
        }
        @keyframes pulseIcon {
            0%, 100% { box-shadow: 0 0 0 0 rgba(184,134,11,0.25); }
            50% { box-shadow: 0 0 0 20px rgba(184,134,11,0); }
        }

        .sub-title {
            font-family: 'Cairo', 'Alexandria', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(180deg, var(--gold-light) 20%, var(--gold) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 8px rgba(184,134,11,0.3));
        }
        .sub-desc {
            font-size: 1rem;
            color: #bcc4d0;
            margin-bottom: 1.5rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 1.5rem 0;
        }
        .action-btn {
            padding: 16px 20px;
            border-radius: 50px;
            border: 1px solid rgba(184, 134, 11, 0.3);
            background: rgba(184, 134, 11, 0.08);
            color: var(--gold-light);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Tajawal', sans-serif;
        }
        .action-btn:hover {
            background: rgba(184, 134, 11, 0.2);
            border-color: var(--gold);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.25);
        }
        .action-btn.primary {
            background: rgba(184, 134, 11, 0.2);
            border-color: var(--gold);
        }
        .action-btn.primary:hover {
            background: rgba(184, 134, 11, 0.35);
        }
        .action-btn.renew {
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        .action-btn.renew:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
        }
        .action-btn i {
            font-size: 1.2rem;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .login-alt {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #8895a7;
        }
        .login-alt a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed transparent;
        }
        .login-alt a:hover {
            color: #fff;
            border-bottom-color: var(--gold-light);
        }

        .mini-footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 0.78rem;
            color: #667080;
            z-index: 2;
            width: 100%;
        }
        .mini-footer span {
            color: var(--gold);
            font-weight: 700;
        }

        /* ===== أنماط المودالات ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 9, 15, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(184, 134, 11, 0.25);
            border-radius: 30px;
            padding: 2rem 1.8rem;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            right: 30px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            border-radius: 0 0 3px 3px;
            opacity: 0.7;
        }
        .modal-box h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            color: var(--gold-light);
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal-box h3 i {
            color: var(--gold);
        }
        .field-group {
            margin-bottom: 1.2rem;
            text-align: right;
        }
        .field-group label {
            display: block;
            font-weight: 600;
            color: #bcc4d0;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .field-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #3a3f4a;
            border-radius: 12px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }
        .field-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(184,134,11,0.25);
        }
        .password-group {
            position: relative;
        }
        .password-group input {
            padding-left: 45px;
        }
        .toggle-pass-modal {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 8px;
            z-index: 2;
            transition: color 0.2s;
        }
        .toggle-pass-modal:hover {
            color: var(--gold-light);
        }
        .domain-hint, .tx-id-hint {
            font-size: 0.72rem;
            color: #8895a7;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .domain-hint i, .tx-id-hint i {
            color: var(--gold-light);
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #3a3f4a;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }
        .strength-weak { background: #ef4444; width: 33%; }
        .strength-medium { background: #f59e0b; width: 66%; }
        .strength-strong { background: #10b981; width: 100%; }
        .strength-text {
            font-size: 0.7rem;
            margin-top: 2px;
            text-align: left;
            color: #8895a7;
            min-height: 1.2em;
        }
        .btn-modal {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.35s ease;
            font-family: 'Tajawal', sans-serif;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-modal:hover:not(:disabled) {
            background: linear-gradient(135deg, #111, #1f1f1f);
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(184,134,11,0.4);
            border: 1px solid var(--gold);
        }
        .btn-modal:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-close {
            background: none;
            border: none;
            color: #8895a7;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-close:hover {
            color: #fff;
        }
        .msg-box {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }
        .msg-box.success {
            background: rgba(75,181,67,0.15);
            color: #4bb543;
            border: 1px solid #4bb543;
        }
        .msg-box.error {
            background: rgba(255,68,68,0.15);
            color: #ff6b6b;
            border: 1px solid #ff4444;
        }
        .msg-box.exists {
            background: rgba(255,165,0,0.12);
            color: #ffa500;
            border: 1px solid #ffa500;
        }
        .msg-box .login-link, .msg-box .renew-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--gold-light);
            text-decoration: underline;
            font-weight: 700;
            cursor: pointer;
        }
        .msg-box .login-link:hover, .msg-box .renew-link:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .sub-card { padding: 2rem 1.4rem; margin: 90px 0 50px; }
            .sub-title { font-size: 1.8rem; }
            .icon-wrapper { width: 70px; height: 70px; }
            .icon-wrapper i { font-size: 2rem; }
            .action-btn { font-size: 0.95rem; padding: 14px 16px; }
            .modal-box { padding: 1.6rem 1.2rem; }
            .mini-nav { top: 10px; right: 10px; }
            .mini-nav .logo-sm { font-size: 0.8rem; padding: 6px 12px; }
            .mini-nav .logo-sm img { height: 22px; }
        }
        @media (max-width: 380px) {
            .sub-title { font-size: 1.5rem; }
            .sub-card { padding: 1.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="mini-nav" data-aos="fade-down" data-aos-duration="700">
        <a href="https://www.farouk-grup.com/" target="_blank" class="logo-sm">
            <img src="https://lh3.googleusercontent.com/d/1e6u-DPTinDJl_Q9wW3QvGgzFbXO_2sXa" alt="FAROUK GRUP LOGO">
            <span>مجموعة فاروق للإستشارات والأعمال</span>
        </a>
    </div>

    <div class="sub-card" data-aos="zoom-in-up" data-aos-duration="800" data-aos-delay="150">
        <div class="icon-wrapper">
            <i class="fas fa-user-plus"></i>
        </div>

        <h1 class="sub-title">منصة التكلفة وهندسة قائمة الطعام</h1>
        <p class="sub-desc">اختر أحد الخيارين للبدء</p>

        <div class="action-buttons">
            <button class="action-btn primary" id="openRegisterModalBtn">
                <i class="fas fa-user-plus"></i> اشتراك جديد
            </button>
            <button class="action-btn renew" id="openRenewModalBtn">
                <i class="fas fa-sync-alt"></i> تجديد الاشتراك
            </button>
        </div>

        <div class="divider"></div>

        <div class="login-alt">
            لديك حساب بالفعل؟ <a href="index.html" target="_blank">تسجيل الدخول</a>
        </div>
    </div>

    <div class="mini-footer">
        جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span> &mdash; إسطنبول، تركيا
    </div>

    <!-- ===== مودال اشتراك جديد ===== -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <h3><i class="fas fa-user-plus"></i> اشتراك جديد</h3>
            <form id="registerForm">
                <div class="field-group">
                    <label>الاسم الكامل (اختياري)</label>
                    <input type="text" id="regFullName" placeholder="الاسم الكامل">
                </div>
                <div class="field-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com" required inputmode="email" autocomplete="email">
                    <div class="domain-hint"><i class="fas fa-shield-alt"></i> نطاقات مسموحة: gmail.com, yahoo.com, outlook.com ...</div>
                </div>
                <div class="field-group password-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" required minlength="6" autocomplete="new-password">
                    <button type="button" class="toggle-pass-modal" id="toggleRegPass" tabindex="-1" aria-label="إظهار كلمة المرور">
                        <i class="fas fa-eye" id="regEyeIcon"></i>
                    </button>
                    <div class="password-strength"><div class="password-strength-bar" id="regStrengthBar"></div></div>
                    <div class="strength-text" id="regStrengthText"></div>
                </div>
                <button type="submit" class="btn-modal" id="regSubmitBtn">
                    <i class="fas fa-check-circle"></i> إنشاء الحساب
                </button>
            </form>
            <div id="regMsgBox" class="msg-box"></div>
            <div style="text-align:center; margin-top:12px;">
                <button class="btn-close" onclick="closeModals()"><i class="fas fa-times"></i> إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ===== مودال تجديد الاشتراك ===== -->
    <div class="modal-overlay" id="renewModal">
        <div class="modal-box">
            <h3><i class="fas fa-sync-alt"></i> تجديد الاشتراك</h3>
            <form id="renewForm">
                <div class="field-group">
                    <label>معرّف العملية (رقم الدفع)</label>
                    <input type="text" id="renewTxId" placeholder="أدخل 8 أرقام على الأقل" required minlength="8">
                    <div class="tx-id-hint"><i class="fas fa-info-circle"></i> يجب أن يكون 8 أرقام أو أكثر</div>
                </div>
                <div class="field-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="renewEmail" placeholder="بريدك المسجل" required inputmode="email" autocomplete="email">
                </div>
                <div class="field-group password-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="renewPassword" placeholder="كلمة المرور" required autocomplete="current-password">
                    <button type="button" class="toggle-pass-modal" id="toggleRenewPass" tabindex="-1" aria-label="إظهار كلمة المرور">
                        <i class="fas fa-eye" id="renewEyeIcon"></i>
                    </button>
                </div>
                <button type="submit" class="btn-modal" id="renewSubmitBtn">
                    <i class="fas fa-sync-alt"></i> تجديد الاشتراك
                </button>
            </form>
            <div id="renewMsgBox" class="msg-box"></div>
            <div style="text-align:center; margin-top:12px;">
                <button class="btn-close" onclick="closeModals()"><i class="fas fa-times"></i> إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 700, once: true, offset: 50 });

        // ===== رابط API الرئيسي =====
        const API_URL = 'https://script.google.com/macros/s/AKfycbxMz1mrmiTQFiXVnOD4nqlf-xDPfIB84hftyVm3jXLRibPygAqurs8-dbv5iXxoTF1-/exec';

        // ===== النطاقات المسموحة للتسجيل =====
        const ALLOWED_DOMAINS = [
            'gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'live.com',
            'icloud.com', 'proton.me', 'protonmail.com', 'zoho.com', 'mail.com',
            'aol.com', 'yandex.com', 'msn.com', 'me.com', 'mac.com'
        ];

        // ===== دوال فتح وإغلاق المودالات =====
        function openRegisterModal() {
            document.getElementById('registerModal').classList.add('active');
            document.getElementById('regFullName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regStrengthBar').className = 'password-strength-bar';
            document.getElementById('regStrengthBar').style.width = '0%';
            document.getElementById('regStrengthText').textContent = '';
            document.getElementById('regMsgBox').style.display = 'none';
            document.getElementById('regMsgBox').className = 'msg-box';
            document.getElementById('regEyeIcon').className = 'fas fa-eye';
            document.getElementById('regPassword').type = 'password';
            document.getElementById('regSubmitBtn').disabled = false;
            document.getElementById('regSubmitBtn').innerHTML = '<i class="fas fa-check-circle"></i> إنشاء الحساب';
        }

        function openRenewModal() {
            document.getElementById('renewModal').classList.add('active');
            document.getElementById('renewTxId').value = '';
            document.getElementById('renewEmail').value = '';
            document.getElementById('renewPassword').value = '';
            document.getElementById('renewMsgBox').style.display = 'none';
            document.getElementById('renewMsgBox').className = 'msg-box';
            document.getElementById('renewEyeIcon').className = 'fas fa-eye';
            document.getElementById('renewPassword').type = 'password';
            document.getElementById('renewSubmitBtn').disabled = false;
            document.getElementById('renewSubmitBtn').innerHTML = '<i class="fas fa-sync-alt"></i> تجديد الاشتراك';
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active'));
        }

        // ربط الأزرار
        document.getElementById('openRegisterModalBtn').addEventListener('click', openRegisterModal);
        document.getElementById('openRenewModalBtn').addEventListener('click', openRenewModal);

        // إغلاق المودال عند الضغط على الخلفية
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) closeModals();
            });
        });

        // ===== إظهار/إخفاء كلمة المرور في مودال التسجيل =====
        document.getElementById('toggleRegPass').addEventListener('click', function() {
            const field = document.getElementById('regPassword');
            const icon = document.getElementById('regEyeIcon');
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
            icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // ===== إظهار/إخفاء كلمة المرور في مودال التجديد =====
        document.getElementById('toggleRenewPass').addEventListener('click', function() {
            const field = document.getElementById('renewPassword');
            const icon = document.getElementById('renewEyeIcon');
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
            icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // ===== مؤشر قوة كلمة المرور في مودال التسجيل =====
        document.getElementById('regPassword').addEventListener('input', function() {
            const val = this.value;
            const bar = document.getElementById('regStrengthBar');
            const txt = document.getElementById('regStrengthText');
            bar.className = 'password-strength-bar';
            txt.textContent = '';
            if (val.length === 0) { bar.style.width = '0%'; return; }
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            if (score <= 2) { bar.classList.add('strength-weak'); txt.textContent = 'ضعيفة – أضف أحرفاً كبيرة وأرقاماً ورموزاً'; txt.style.color = '#ef4444'; }
            else if (score <= 4) { bar.classList.add('strength-medium'); txt.textContent = 'متوسطة – كلمة مرور مقبولة'; txt.style.color = '#f59e0b'; }
            else { bar.classList.add('strength-strong'); txt.textContent = 'قوية – كلمة مرور ممتازة'; txt.style.color = '#10b981'; }
        });

        // ===== دوال مساعدة =====
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        function getEmailDomain(email) {
            const parts = email.split('@');
            return parts.length === 2 ? parts[1].toLowerCase().trim() : '';
        }

        // ===== نموذج التسجيل (بدون تغيير) =====
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgBox = document.getElementById('regMsgBox');
            msgBox.style.display = 'none';
            msgBox.className = 'msg-box';

            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!validateEmail(email)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> الرجاء إدخال بريد إلكتروني صحيح';
                return;
            }
            const domain = getEmailDomain(email);
            if (!domain || !ALLOWED_DOMAINS.includes(domain)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-ban"></i> نطاق البريد غير مسموح. استخدم Gmail أو Yahoo أو Outlook إلخ.';
                return;
            }
            if (password.length < 6) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-lock"></i> كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                return;
            }

            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري إنشاء الحساب...';

            try {
                const params = { email, password, fullName: fullName || '' };
                const url = API_URL + '?fn=register&params=' + encodeURIComponent(JSON.stringify(params));
                const resp = await fetch(url);
                const data = await resp.json();

                msgBox.style.display = 'block';
                if (data.status === 'success') {
                    msgBox.className = 'msg-box success';
                    msgBox.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message || 'تم التسجيل بنجاح!'}<br>
                        <a href="index.html" target="_blank" class="login-link">اذهب إلى تسجيل الدخول</a>`;
                    document.getElementById('registerForm').reset();
                    document.getElementById('regStrengthBar').className = 'password-strength-bar';
                    document.getElementById('regStrengthBar').style.width = '0%';
                    document.getElementById('regStrengthText').textContent = '';
                } else if (data.status === 'exists') {
                    msgBox.className = 'msg-box exists';
                    msgBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${data.message || 'هذا البريد مسجل مسبقاً'}<br>
                        <button class="renew-link" onclick="closeModals(); openRenewModal();">اضغط هنا لتجديد الاشتراك</button>`;
                } else {
                    msgBox.className = 'msg-box error';
                    msgBox.innerHTML = '<i class="fas fa-times-circle"></i> ' + (data.message || 'حدث خطأ غير معروف');
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-plug"></i> تعذر الاتصال بالسيرفر. حاول مجدداً.';
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> إنشاء الحساب';
            }
        });

        // ===== نموذج التجديد (مع التحقق المسبق) =====
        document.getElementById('renewForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgBox = document.getElementById('renewMsgBox');
            msgBox.style.display = 'none';
            msgBox.className = 'msg-box';

            const txId = document.getElementById('renewTxId').value.trim();
            const email = document.getElementById('renewEmail').value.trim();
            const password = document.getElementById('renewPassword').value;

            // التحقق من معرّف العملية (8 أرقام على الأقل)
            if (txId.length < 8 || !/^\d+$/.test(txId)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> معرّف العملية يجب أن يكون 8 أرقام على الأقل';
                return;
            }
            if (!validateEmail(email)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> الرجاء إدخال بريد إلكتروني صحيح';
                return;
            }
            if (!password || password.length < 1) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-lock"></i> الرجاء إدخال كلمة المرور';
                return;
            }

            const btn = document.getElementById('renewSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التحقق من البيانات...';

            try {
                // الخطوة 1: التحقق من صحة البريد وكلمة المرور عبر login
                const loginUrl = API_URL + '?fn=login&username=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password);
                const loginResp = await fetch(loginUrl);
                const loginData = await loginResp.json();

                if (loginData.status !== 'success') {
                    // فشل التحقق
                    msgBox.style.display = 'block';
                    msgBox.className = 'msg-box error';
                    if (loginData.status === 'expired') {
                        msgBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> اشتراكك منتهٍ. يمكنك التجديد من خلال الضغط على زر التجديد مرة أخرى.';
                    } else if (loginData.status === 'frozen') {
                        msgBox.innerHTML = '<i class="fas fa-ban"></i> حسابك مجمّد. راجع الإدارة.';
                    } else {
                        msgBox.innerHTML = '<i class="fas fa-times-circle"></i> البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> تجديد الاشتراك';
                    return;
                }

                // الخطوة 2: التحقق ناجح، نقوم بتجديد الاشتراك (إضافة سنة إلى تاريخ اليوم)
                // ملاحظة: هذا الحل سيضيف سنة من تاريخ اليوم، وليس من تاريخ الانتهاء الحالي.
                // لتحسين ذلك، يجب تعديل السيرفر بحيث يقرأ التاريخ الحالي ويضيف إليه سنة.
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري تجديد الاشتراك...';

                const renewUrl = API_URL + '?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password);
                const renewResp = await fetch(renewUrl);
                const renewData = await renewResp.json();

                msgBox.style.display = 'block';
                if (renewData.status === 'success' || renewData.status === 'exists') {
                    // نحسب التاريخ الجديد (تاريخ اليوم + سنة) لعرضه
                    const today = new Date();
                    const newExpiry = new Date(today);
                    newExpiry.setFullYear(today.getFullYear() + 1);
                    const formattedDate = newExpiry.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    
                    msgBox.className = 'msg-box success';
                    msgBox.innerHTML = `<i class="fas fa-check-circle"></i> ✅ تم تجديد اشتراكك بنجاح <br>
                        <a href="index.html" target="_blank" class="login-link">اذهب إلى تسجيل الدخول</a>`;
                    document.getElementById('renewForm').reset();
                } else {
                    msgBox.className = 'msg-box error';
                    msgBox.innerHTML = '<i class="fas fa-times-circle"></i> ' + (renewData.message || 'فشل التجديد. حاول مجدداً.');
                }
            } catch (err) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-plug"></i> تعذر الاتصال بالسيرفر. حاول مجدداً.';
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تجديد الاشتراك';
            }
        });
    </script>
</body>
</html>
