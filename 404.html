<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#b48554">
    <title>404 — Mataami Pro | مطعمي برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <style>
        :root {
            --accent: #b48554;
            --accent-soft: #cfa776;
            --bg-start: #141c2b;
            --bg-end: #0a0e16;
            --card-bg: rgba(18, 24, 36, 0.85);
            --text: #f0f4fa;
            --text-muted: #8a9aad;
            --border: rgba(180, 133, 84, 0.25);
            --border-strong: rgba(180, 133, 84, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        /* body: عمودي — الحاوية تتوسّط عمودياً بـ margin-block: auto
           (لا قصّ عند التمرير، ولا overflow:hidden يمنع الـ scroll) */
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 70% 30%, var(--bg-start), var(--bg-end));
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 3.75rem 1rem 1rem;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        [dir="ltr"] body {
            background: radial-gradient(circle at 30% 30%, var(--bg-start), var(--bg-end));
        }

        /* توهج الخلفية (يحوي overflow خاص به — لا يحتاج body) */
        .glow-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .glow-bg span {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        .glow-bg span:nth-child(1) {
            width: 420px; height: 420px;
            background: var(--accent);
            top: -110px; inset-inline-end: -110px;
            opacity: 0.32;
        }
        .glow-bg span:nth-child(2) {
            width: 320px; height: 320px;
            background: #4a7ba8;
            bottom: -90px; inset-inline-start: -90px;
            opacity: 0.22;
        }
        .glow-bg span:nth-child(3) {
            width: 260px; height: 260px;
            background: var(--accent-soft);
            bottom: 42%; inset-inline-start: 28%;
            opacity: 0.14;
        }

        /* حاوية الخطأ — أحجام مرنة بـ clamp() */
        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: min(440px, 100%);
            width: 100%;
            margin-block: auto; /* توسّط عمودي سليم بدون قصّ عند الزيادة */
            padding: clamp(1.4rem, 3.5vw, 1.9rem) clamp(1.1rem, 3vw, 1.75rem) clamp(1.15rem, 3vw, 1.4rem);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border-radius: clamp(20px, 4vw, 26px);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* العلامة التجارية */
        .logo-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: clamp(0.7rem, 1.8vh, 1.05rem);
            color: var(--accent-soft);
            font-weight: 700;
            font-size: clamp(0.92rem, 2.3vw, 1.02rem);
            letter-spacing: 0.2px;
        }
        .logo-brand i { font-size: clamp(1.05rem, 2.6vw, 1.25rem); }
        .logo-brand small {
            font-size: clamp(0.68rem, 1.8vw, 0.75rem);
            opacity: 0.75;
            font-weight: 400;
        }

        /* أيقونة الخطأ */
        .error-icon {
            width: clamp(60px, 13vw, 80px);
            height: clamp(60px, 13vw, 80px);
            margin: 0 auto clamp(0.75rem, 1.8vh, 1rem);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(180, 133, 84, 0.12);
            border: 2px solid var(--border);
            animation: pulse 2.8s ease-in-out infinite;
        }
        .error-icon i {
            font-size: clamp(1.65rem, 4.8vw, 2.15rem);
            color: var(--accent-soft);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(180, 133, 84, 0.45); }
            55%      { box-shadow: 0 0 0 18px rgba(180, 133, 84, 0); }
        }

        /* رقم 404 */
        .error-code {
            font-size: clamp(2.75rem, 10vw, 4rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: clamp(0.35rem, 1.2vh, 0.55rem);
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 60%, #8b6340 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            direction: ltr;
            unicode-bidi: isolate;
        }

        h1 {
            font-size: clamp(1.02rem, 3vw, 1.22rem);
            margin-bottom: clamp(0.3rem, 1vh, 0.45rem);
            color: var(--text);
            font-weight: 700;
            line-height: 1.35;
        }

        p.description {
            font-size: clamp(0.8rem, 2.2vw, 0.9rem);
            color: var(--text-muted);
            margin-bottom: clamp(0.95rem, 2.5vh, 1.35rem);
            line-height: 1.6;
            max-width: 380px;
            margin-inline: auto;
        }

        /* زر العودة */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(180, 133, 84, 0.18);
            border: 1px solid var(--border-strong);
            border-radius: 40px;
            padding: clamp(0.6rem, 1.8vw, 0.72rem) clamp(1.35rem, 3.6vw, 1.75rem);
            color: var(--accent-soft);
            text-decoration: none;
            font-weight: 700;
            font-size: clamp(0.82rem, 2.2vw, 0.9rem);
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-home:hover,
        .btn-home:focus-visible {
            background: var(--accent);
            color: #0a0e16;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(180, 133, 84, 0.4);
            outline: none;
        }
        .btn-home:active { transform: translateY(0); }

        /* مبدّل اللغة */
        .lang-picker {
            position: fixed;
            top: clamp(10px, 2.4vh, 16px);
            inset-inline-start: clamp(10px, 2vw, 16px);
            display: flex;
            gap: 3px;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 4px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }
        .lang-picker button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: clamp(0.72rem, 1.8vw, 0.8rem);
            font-weight: 700;
            padding: clamp(5px, 1.2vw, 7px) clamp(8px, 2vw, 12px);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }
        .lang-picker button:hover { color: var(--accent-soft); }
        .lang-picker button.active {
            background: var(--accent);
            color: #0a0e16;
        }

        /* ذيل العلامة التجارية */
        .brand-footer {
            margin-top: clamp(0.95rem, 2.5vh, 1.3rem);
            padding-top: clamp(0.7rem, 1.9vh, 1rem);
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: clamp(0.67rem, 1.7vw, 0.74rem);
            line-height: 1.8;
        }
        .brand-footer strong {
            color: var(--accent-soft);
            letter-spacing: 0.4px;
        }
        .brand-footer .dot {
            display: inline-block;
            margin: 0 5px;
            opacity: 0.4;
        }

        /* شاشات قصيرة (تلفون بالوضع الأفقي / لابتوب صغير) */
        @media (max-height: 620px) {
            body { padding-top: 3.25rem; padding-bottom: 0.75rem; }
            .error-icon { display: none; }
            .brand-footer { display: none; }
            .logo-brand { margin-bottom: 0.55rem; }
            p.description { margin-bottom: 0.9rem; }
        }

        @media (max-width: 380px) {
            body { padding-inline: 0.7rem; }
            .error-container { padding-inline: 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="glow-bg" aria-hidden="true"><span></span><span></span><span></span></div>

    <div class="lang-picker" id="langPicker" role="group" aria-label="Language">
        <button type="button" data-lang="ar" onclick="mp404.setLang('ar')">العربية</button>
        <button type="button" data-lang="en" onclick="mp404.setLang('en')">English</button>
        <button type="button" data-lang="tr" onclick="mp404.setLang('tr')">Türkçe</button>
    </div>

    <main class="error-container" role="main">
        <div class="logo-brand">
            <i class="fas fa-utensils" aria-hidden="true"></i>
            <span>Mataami Pro</span>
            <small id="brandSub">| مطعمي برو</small>
        </div>

        <div class="error-icon" aria-hidden="true">
            <i class="fas fa-bowl-food"></i>
        </div>

        <div class="error-code" aria-hidden="true">404</div>

        <h1 id="titleText">الصفحة غير موجودة</h1>
        <p class="description" id="descText">
            عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. تأكد من الرابط أو عُد إلى الصفحة الرئيسية.
        </p>

        <a href="/index.html" class="btn-home" id="homeBtn">
            <i class="fas fa-house" aria-hidden="true"></i>
            <span id="homeBtnText">العودة للرئيسية</span>
        </a>

        <div class="brand-footer">
            <strong>FAROUK GRUP</strong>
            <span class="dot">·</span>
            <span id="footerText">منصة مطعمي برو لإدارة المطاعم</span>
            <br>
            <span id="versionText">الإصدار 5.4.4</span>
        </div>
    </main>

    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'fcLang';
        var HOME_URL = '/index.html';

        var translations = {
            ar: {
                dir: 'rtl',
                documentTitle: '404 — مطعمي برو | الصفحة غير موجودة',
                brandSub: '| مطعمي برو',
                title: 'الصفحة غير موجودة',
                description: 'عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. تأكد من الرابط أو عُد إلى الصفحة الرئيسية.',
                homeBtn: 'العودة للرئيسية',
                footer: 'منصة مطعمي برو لإدارة المطاعم',
                version: 'الإصدار 5.4.4'
            },
            en: {
                dir: 'ltr',
                documentTitle: '404 — Mataami Pro | Page Not Found',
                brandSub: '| Mataami Pro',
                title: 'Page Not Found',
                description: 'Sorry, the page you are looking for does not exist or has been moved. Please check the URL or return to the homepage.',
                homeBtn: 'Back to Home',
                footer: 'Mataami Pro — Restaurant Management Platform',
                version: 'Version 5.4.4'
            },
            tr: {
                dir: 'ltr',
                documentTitle: '404 — Mataami Pro | Sayfa Bulunamadı',
                brandSub: '| Mataami Pro',
                title: 'Sayfa Bulunamadı',
                description: 'Üzgünüz, aradığınız sayfa mevcut değil veya taşınmış. Lütfen URL\'yi kontrol edin veya ana sayfaya dönün.',
                homeBtn: 'Ana Sayfaya Dön',
                footer: 'Mataami Pro — Restoran Yönetim Platformu',
                version: 'Sürüm 5.4.4'
            }
        };

        function safeGetStorage(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSetStorage(key, val) {
            try { localStorage.setItem(key, val); } catch (e) { /* ignore */ }
        }

        function detectLang() {
            try {
                var params = new URLSearchParams(window.location.search);
                var urlLang = (params.get('lang') || '').toLowerCase().slice(0, 2);
                if (translations[urlLang]) return urlLang;
            } catch (e) { /* ignore */ }

            var saved = safeGetStorage(STORAGE_KEY) || safeGetStorage('lang');
            if (saved && translations[saved]) return saved;

            var navLang = (navigator.language || navigator.userLanguage || 'ar')
                .toLowerCase().slice(0, 2);
            if (translations[navLang]) return navLang;

            return 'ar';
        }

        function setLang(lang) {
            if (!translations[lang]) lang = 'ar';
            var t = translations[lang];

            safeSetStorage(STORAGE_KEY, lang);
            safeSetStorage('lang', lang);

            document.documentElement.lang = lang;
            document.documentElement.dir = t.dir;

            var setText = function (id, text) {
                var el = document.getElementById(id);
                if (el) el.textContent = text;
            };
            setText('brandSub', t.brandSub);
            setText('titleText', t.title);
            setText('descText', t.description);
            setText('homeBtnText', t.homeBtn);
            setText('footerText', t.footer);
            setText('versionText', t.version);

            document.title = t.documentTitle;

            var homeBtn = document.getElementById('homeBtn');
            if (homeBtn) homeBtn.setAttribute('href', HOME_URL);

            var buttons = document.querySelectorAll('#langPicker button[data-lang]');
            for (var i = 0; i < buttons.length; i++) {
                var b = buttons[i];
                var isActive = b.getAttribute('data-lang') === lang;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            }

            try {
                var url = new URL(window.location.href);
                url.searchParams.set('lang', lang);
                window.history.replaceState(null, '', url.toString());
            } catch (e) { /* ignore */ }
        }

        window.mp404 = { setLang: setLang };

        var init = detectLang();
        setLang(init);
    })();
    </script>
</body>
</html>
